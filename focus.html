<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Фокус</title>
<link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@400;600;700;900&family=Golos+Text:wght@400;500;600&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html,body{width:100%;height:100%;overflow:hidden;background:#06041a;}
body{font-family:'Golos Text',sans-serif;color:#f0e8ff;}

.screen{display:none;width:100%;height:100vh;flex-direction:column;overflow:hidden;}
.screen.active{display:flex;}

/* ── SETTINGS ── */
#sSettings{
  background:linear-gradient(180deg,#0d0a28,#130e38 60%,#0d0a28);
  overflow-y:auto;align-items:center;padding:52px 20px 32px;gap:14px;
}
.set-back{align-self:flex-start;color:#6050a0;font-size:13px;cursor:pointer;text-decoration:underline;}
.set-label{font-family:'Unbounded',sans-serif;font-size:11px;font-weight:600;letter-spacing:.2em;color:#6050a0;text-transform:uppercase;}
.set-title{font-family:'Unbounded',sans-serif;font-size:22px;font-weight:700;text-align:center;background:linear-gradient(135deg,#f0e8ff,#ffb3cc);-webkit-background-clip:text;-webkit-text-fill-color:transparent;}

/* SCENE SELECTOR */
.scene-selector{width:100%;display:flex;gap:10px;}
.scene-card{
  flex:1;border-radius:16px;padding:14px;cursor:pointer;
  background:var(--surface,rgba(13,22,48,0.85));
  border:2px solid rgba(255,255,255,0.08);
  transition:all 0.25s;text-align:center;
}
.scene-card.active{border-color:rgba(255,107,157,0.6);background:rgba(255,107,157,0.08);}
.scene-card:active{transform:scale(0.97);}
.scene-icon{font-size:28px;margin-bottom:6px;}
.scene-name{font-family:'Unbounded',sans-serif;font-size:10px;font-weight:700;letter-spacing:0.08em;color:#f0e8ff;}
.scene-desc{font-size:11px;color:#6050a0;margin-top:3px;}

.sliders{width:100%;display:flex;flex-direction:column;gap:10px;}
.scard{background:rgba(255,255,255,0.06);border:1px solid rgba(255,255,255,0.1);border-radius:16px;padding:16px 18px;}
.srow{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;}
.sname{font-size:14px;font-weight:500;}
.sval{font-family:'Unbounded',sans-serif;font-size:16px;font-weight:700;color:#ff6b9d;}
input[type=range]{width:100%;-webkit-appearance:none;height:5px;border-radius:5px;background:rgba(255,255,255,0.12);outline:none;cursor:pointer;}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:24px;height:24px;border-radius:50%;background:linear-gradient(135deg,#ff6b9d,#c44dff);box-shadow:0 0 12px rgba(255,107,157,.5);cursor:pointer;}
.start-btn{width:100%;background:linear-gradient(135deg,#ff6b9d,#c44dff);border:none;border-radius:18px;padding:18px;color:#fff;font-family:'Unbounded',sans-serif;font-size:14px;font-weight:700;letter-spacing:.08em;cursor:pointer;box-shadow:0 8px 30px rgba(255,107,157,.4);}
.start-btn:active{opacity:.88;transform:scale(.97);}

/* ── FOCUS ── */
#sFocus{position:relative;}
#mainCanvas{position:absolute;inset:0;width:100%;height:100%;display:block;}

/* petals */
.petal-layer{position:absolute;inset:0;pointer-events:none;z-index:4;overflow:hidden;}
.pk{position:absolute;top:-18px;opacity:0;animation:pfall linear infinite;}
@keyframes pfall{
  0%{opacity:0;transform:translateY(0) rotate(0deg) translateX(0)}
  8%{opacity:.85} 90%{opacity:.65}
  100%{opacity:0;transform:translateY(108vh) rotate(480deg) translateX(90px)}
}
/* GoT snow particles */
.snow-layer{position:absolute;inset:0;pointer-events:none;z-index:4;overflow:hidden;}
.snowflake{position:absolute;top:-10px;opacity:0;animation:snowfall linear infinite;}
@keyframes snowfall{
  0%{opacity:0;transform:translateY(0) translateX(0)}
  10%{opacity:0.7}
  90%{opacity:0.4}
  100%{opacity:0;transform:translateY(110vh) translateX(60px)}
}

/* fire */
.fire-layer{position:absolute;inset:0;pointer-events:none;z-index:6;}
.fp{position:absolute;border-radius:50% 50% 30% 30%;animation:frise linear forwards;}
@keyframes frise{0%{opacity:1;transform:translateY(0)}100%{opacity:0;transform:translateY(-200px)}}

/* UI */
.focus-ui{position:absolute;inset:0;z-index:10;display:flex;flex-direction:column;justify-content:space-between;padding:52px 20px 36px;pointer-events:none;}
.focus-ui>*{pointer-events:all;}
.f-top{display:flex;justify-content:space-between;align-items:center;}
.sess-badge{font-family:'Unbounded',sans-serif;font-size:11px;font-weight:600;letter-spacing:.1em;color:rgba(240,232,255,.7);background:rgba(6,4,26,.6);border:1px solid rgba(255,255,255,.15);border-radius:20px;padding:6px 14px;backdrop-filter:blur(8px);}
.set-ico{width:36px;height:36px;border-radius:12px;background:rgba(6,4,26,.6);border:1px solid rgba(255,255,255,.15);display:flex;align-items:center;justify-content:center;font-size:16px;cursor:pointer;backdrop-filter:blur(8px);}
.f-mid{flex:1;pointer-events:none;}
.f-bottom{display:flex;flex-direction:column;align-items:center;gap:10px;}
.quit-btn{width:100%;border:none;border-radius:16px;padding:15px;font-family:'Unbounded',sans-serif;font-size:13px;font-weight:700;letter-spacing:.06em;cursor:pointer;transition:all .35s;backdrop-filter:blur(14px);}
.quit-btn.work{background:rgba(140,20,20,.35);border:1px solid rgba(255,80,80,.5);color:#ff9090;}
.quit-btn.rest{background:rgba(100,50,200,.35);border:1px solid rgba(160,110,255,.5);color:#c0a8ff;}
.quit-btn:active{transform:scale(.96);}
.t-phase{font-family:'Unbounded',sans-serif;font-size:10px;font-weight:600;letter-spacing:.2em;text-transform:uppercase;text-align:center;}
.t-phase.work{color:rgba(255,200,215,.7);}
.t-phase.rest{color:rgba(180,215,255,.7);}
.t-num{font-family:'Unbounded',sans-serif;font-size:40px;font-weight:900;line-height:1;letter-spacing:-.02em;text-align:center;text-shadow:0 0 30px rgba(255,150,190,.5),0 2px 14px rgba(0,0,0,.9);}
.t-num.work{color:rgba(255,242,248,.92);}
.t-num.rest{color:rgba(200,228,255,.92);}
.t-hint{font-size:11px;color:rgba(200,185,240,.4);margin-top:2px;text-align:center;}

/* END */
.end-screen{background:linear-gradient(180deg,#0d0a28,#130e38,#0d0a28);align-items:center;justify-content:center;text-align:center;padding:60px 24px 40px;overflow-y:auto;gap:0;}
.end-icon{font-size:58px;margin-bottom:14px;animation:pop .5s cubic-bezier(.34,1.56,.64,1);}
@keyframes pop{from{transform:scale(0)}to{transform:scale(1)}}
.end-title{font-family:'Unbounded',sans-serif;font-size:22px;font-weight:900;margin-bottom:8px;}
.end-title.win{background:linear-gradient(135deg,#ffb3cc,#c44dff);-webkit-background-clip:text;-webkit-text-fill-color:transparent;}
.end-title.lose{color:#ff7070;}
.end-sub{font-size:14px;color:#6050a0;line-height:1.6;margin-bottom:10px;}
.end-xp{font-family:'Unbounded',sans-serif;font-size:30px;font-weight:900;color:#fde047;margin-bottom:16px;}
.end-canvas-wrap{width:min(280px,85vw);border-radius:16px;overflow:hidden;margin:0 auto 22px;}
.end-canvas-wrap canvas{display:block;width:100%;height:auto;}
.end-btn{width:100%;border:none;border-radius:16px;padding:16px;color:#fff;font-family:'Unbounded',sans-serif;font-size:13px;font-weight:700;cursor:pointer;}
.end-btn.win{background:linear-gradient(135deg,#ff6b9d,#c44dff);box-shadow:0 8px 28px rgba(255,107,157,.4);}
.end-btn.lose{background:linear-gradient(135deg,#ff6b6b,#cc2200);}
</style>
</head>
<body>

<!-- SETTINGS -->
<div class="screen active" id="sSettings">
  <div class="set-back" onclick="goHome()">← К задачам</div>
  <div class="set-label">режим фокуса</div>
  <div class="set-title">Выбери сцену 🎴</div>

  <div class="scene-selector">
    <div class="scene-card active" id="scene-sakura" onclick="selectScene('sakura')">
      <div class="scene-icon">🌸</div>
      <div class="scene-name">САКУРА</div>
      <div class="scene-desc">Дерево растёт с ветром</div>
    </div>
    <div class="scene-card" id="scene-katana" onclick="selectScene('katana')">
      <div class="scene-icon">⚔️</div>
      <div class="scene-name">КАТАНА</div>
      <div class="scene-desc">Призрак Цусимы</div>
    </div>
  </div>

  <div class="sliders">
    <div class="scard"><div class="srow"><span class="sname">🌸 Время фокуса</span><span class="sval" id="vF">25 мин</span></div><input type="range" id="rF" min="5" max="120" value="25" step="5" oninput="onSlide()"></div>
    <div class="scard"><div class="srow"><span class="sname">☕ Перерыв</span><span class="sval" id="vB">5 мин</span></div><input type="range" id="rB" min="1" max="30" value="5" step="1" oninput="onSlide()"></div>
    <div class="scard"><div class="srow"><span class="sname">🔄 Сессий подряд</span><span class="sval" id="vS">2</span></div><input type="range" id="rS" min="1" max="6" value="2" step="1" oninput="onSlide()"></div>
  </div>
  <button class="start-btn" onclick="startFocus()">⚔️ ПРИСТУПАЮ</button>
</div>

<!-- FOCUS -->
<div class="screen" id="sFocus">
  <canvas id="mainCanvas"></canvas>
  <div class="petal-layer" id="petalLayer"></div>
  <div class="snow-layer" id="snowLayer"></div>
  <div class="fire-layer" id="fireLayer"></div>
  <div class="focus-ui">
    <div class="f-top">
      <div class="sess-badge" id="sessBadge">Сессия 1/2</div>
      <div class="set-ico" onclick="openSettings()">⚙️</div>
    </div>
    <div class="f-mid"></div>
    <div class="f-bottom">
      <button class="quit-btn work" id="qBtn" onclick="onQuit()">🔥 СДАТЬСЯ</button>
      <div>
        <div class="t-phase work" id="tPhase">ФОКУС</div>
        <div class="t-num work" id="tNum">25:00</div>
        <div class="t-hint" id="tHint">Сосредоточься</div>
      </div>
    </div>
  </div>
</div>

<!-- WIN -->
<div class="screen end-screen" id="sWin">
  <div class="end-icon">🌸</div>
  <div class="end-title win">СЕССИЯ ЗАВЕРШЕНА</div>
  <div class="end-sub">Ты продержался все сессии.</div>
  <div class="end-xp" id="winXp">+50 XP ⚡</div>
  <div class="end-canvas-wrap"><canvas id="winCanvas" width="280" height="220"></canvas></div>
  <button class="end-btn win" onclick="show('sSettings')">🌱 Новая сессия</button>
</div>

<!-- LOSE -->
<div class="screen end-screen" id="sLose">
  <div class="end-icon">🔥</div>
  <div class="end-title lose">ФОКУС ПРЕРВАН</div>
  <div class="end-sub">Попробуй снова.</div>
  <div class="end-canvas-wrap"><canvas id="loseCanvas" width="280" height="220"></canvas></div>
  <button class="end-btn lose" onclick="show('sSettings')">↩ Попробовать снова</button>
</div>

<script>
// ═══════════════════════════════════════════════════
//  SCENE: SAKURA — growing tree with wind & petals
// ═══════════════════════════════════════════════════

let windTime = 0;
let windStr = 0.4;
let windTarget = 0.4;
let windGust = 0;
let treeSwayAngle = 0;

function updateWind() {
  windTime += 0.016;
  windGust -= 0.016;
  if (windGust <= 0) {
    windTarget = 0.2 + Math.random() * 0.8;
    if (Math.random() > 0.7) windTarget *= -0.3; // occasional reverse
    windGust = 1.5 + Math.random() * 4;
  }
  windStr += (windTarget - windStr) * 0.025;
  treeSwayAngle = windStr * 0.04 * Math.sin(windTime * 1.4);
}

function drawSakuraScene(canvas, progress, burned, time) {
  const ctx = canvas.getContext('2d');
  const W = canvas.width, H = canvas.height;
  ctx.clearRect(0, 0, W, H);
  const p = Math.max(0, Math.min(1, progress));
  const t = time || 0;
  const ws = burned ? 0 : windStr;

  // ── SKY ──
  const sky = ctx.createLinearGradient(0, 0, 0, H * 0.75);
  if (burned) {
    sky.addColorStop(0, '#0a0205'); sky.addColorStop(0.5, '#150408'); sky.addColorStop(1, '#0a0205');
  } else if (p > 0.6) {
    const dp = Math.min((p - 0.6) / 0.4, 1);
    sky.addColorStop(0, lerpC('#0d0830', '#0e1840', dp));
    sky.addColorStop(0.4, lerpC('#1a1255', '#1a2860', dp));
    sky.addColorStop(1, '#06041a');
  } else {
    sky.addColorStop(0, '#06041a'); sky.addColorStop(0.5, '#0d0830'); sky.addColorStop(1, '#06041a');
  }
  ctx.fillStyle = sky; ctx.fillRect(0, 0, W, H);

  // stars
  if (!burned && p < 0.7) {
    const sa = (1 - p / 0.7) * 0.75;
    [[.1,.06],[.82,.04],[.22,.16],[.68,.09],[.9,.21],[.07,.29],[.93,.33],[.42,.05],[.57,.14]].forEach(([sx,sy]) => {
      const tw = 0.5 + 0.5 * Math.sin(t * 2.5 + sx * 12);
      ctx.beginPath(); ctx.arc(sx*W, sy*H*0.65, 1.4, 0, Math.PI*2);
      ctx.fillStyle = `rgba(255,255,255,${sa*tw})`; ctx.fill();
    });
  }

  // sun glow
  if (!burned && p > 0.5) {
    const gp = Math.min((p-0.5)/0.5, 1);
    const sunY = H * 0.22;
    const g = ctx.createRadialGradient(W*0.5, sunY, 0, W*0.5, sunY, W*0.6);
    g.addColorStop(0, `rgba(255,210,120,${0.45*gp})`);
    g.addColorStop(0.3, `rgba(255,160,80,${0.2*gp})`);
    g.addColorStop(0.7, `rgba(200,100,180,${0.08*gp})`);
    g.addColorStop(1, 'transparent');
    ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
  }

  // ── WIND STREAKS ──
  if (!burned && Math.abs(ws) > 0.2) {
    const wa = Math.min(Math.abs(ws) * 0.3, 0.25);
    for (let i = 0; i < 8; i++) {
      const wy = H * (0.1 + Math.random() * 0.7);
      const wlen = 30 + Math.random() * 80;
      const wx = (W * (i / 8) + t * ws * 180) % (W + 100) - 50;
      const wg = ctx.createLinearGradient(wx, wy, wx + wlen, wy);
      wg.addColorStop(0, 'transparent');
      wg.addColorStop(0.4, `rgba(255,255,255,${wa * Math.random()})`);
      wg.addColorStop(1, 'transparent');
      ctx.strokeStyle = wg; ctx.lineWidth = 0.6 + Math.random();
      ctx.beginPath(); ctx.moveTo(wx, wy); ctx.lineTo(wx + wlen, wy + (Math.random()-0.5)*4); ctx.stroke();
    }
  }

  // ── FAR MOUNTAINS ──
  ctx.save();
  const mopa = burned ? 0.3 : 0.4;
  const mc = burned ? '#0e0405' : '#1a1640';
  ctx.beginPath();
  ctx.moveTo(-10, H);
  ctx.lineTo(-10, H*0.5);
  [[0.08,0.38],[0.18,0.22],[0.3,0.42],[0.42,0.18],[0.55,0.44],[0.65,0.24],[0.78,0.46],[0.9,0.2],[1.05,0.35]].forEach(([x,y]) => {
    ctx.lineTo(x*W, H*0.52 - y*H*0.32);
  });
  ctx.lineTo(W+10, H); ctx.closePath();
  ctx.fillStyle = mc; ctx.globalAlpha = mopa; ctx.fill(); ctx.globalAlpha = 1;
  ctx.restore();

  // mist
  if (!burned && p > 0.15) {
    const mg = ctx.createLinearGradient(0, H*0.52, 0, H*0.68);
    mg.addColorStop(0, 'transparent');
    mg.addColorStop(0.5, `rgba(160,150,220,${Math.min(p/0.3, 1)*0.14})`);
    mg.addColorStop(1, 'transparent');
    ctx.fillStyle = mg; ctx.fillRect(0, H*0.52, W, H*0.16);
  }

  // ── CLIFF ──
  const cliffY = H * 0.73;
  const cw = W * 0.44;
  ctx.save();
  ctx.shadowColor = 'rgba(0,0,0,0.8)'; ctx.shadowBlur = 20; ctx.shadowOffsetX = 6;
  ctx.beginPath();
  ctx.moveTo(W*0.5-cw*0.72, H+10);
  ctx.lineTo(W*0.5-cw*0.6, cliffY+H*0.05);
  ctx.quadraticCurveTo(W*0.5-cw*0.46, cliffY, W*0.5-cw*0.08, cliffY-H*0.012);
  ctx.quadraticCurveTo(W*0.5, cliffY-H*0.02, W*0.5+cw*0.08, cliffY-H*0.012);
  ctx.quadraticCurveTo(W*0.5+cw*0.46, cliffY, W*0.5+cw*0.6, cliffY+H*0.05);
  ctx.lineTo(W*0.5+cw*0.72, H+10); ctx.closePath();
  const cg = ctx.createLinearGradient(0, cliffY, 0, H);
  cg.addColorStop(0, burned?'#160a04':'#26203a');
  cg.addColorStop(0.4, burned?'#0e0702':'#181428');
  cg.addColorStop(1, burned?'#060402':'#0c0a1a');
  ctx.fillStyle = cg; ctx.fill();
  ctx.restore();

  // moss
  if (!burned) {
    const moss = ctx.createRadialGradient(W*0.5, cliffY, 0, W*0.5, cliffY, cw*0.44);
    moss.addColorStop(0, 'rgba(42,100,35,0.6)'); moss.addColorStop(0.65, 'rgba(28,75,22,0.28)'); moss.addColorStop(1, 'transparent');
    ctx.fillStyle = moss; ctx.beginPath(); ctx.ellipse(W*0.5, cliffY, cw*0.44, H*0.022, 0, 0, Math.PI*2); ctx.fill();
  }

  if (p < 0.04) return;

  // ── ROOTS ──
  const rp = Math.min(p * 2.8, 1);
  ctx.save();
  [
    {cx1:-.15,cy1:.042,ex:-.32,ey:.17,w:4.5},
    {cx1:-.10,cy1:.065,ex:-.26,ey:.24,w:3.2},
    {cx1:.15,cy1:.042,ex:.32,ey:.17,w:4.5},
    {cx1:.10,cy1:.065,ex:.26,ey:.24,w:3.2},
    {cx1:-.04,cy1:.08,ex:-.13,ey:.3,w:2.2},
    {cx1:.04,cy1:.08,ex:.13,ey:.3,w:2.2},
  ].forEach(r => {
    ctx.beginPath(); ctx.moveTo(W*0.5, cliffY);
    ctx.quadraticCurveTo(W*0.5+r.cx1*W, cliffY+r.cy1*H, W*0.5+r.ex*W*rp, cliffY+r.ey*H*rp);
    ctx.strokeStyle = burned?'rgba(18,7,2,.85)':'rgba(62,30,12,.88)';
    ctx.lineWidth = r.w*rp; ctx.lineCap = 'round'; ctx.stroke();
    ctx.beginPath(); ctx.moveTo(W*0.5, cliffY);
    ctx.quadraticCurveTo(W*0.5+r.cx1*W*.88, cliffY+r.cy1*H*.8, W*0.5+r.ex*W*rp*.62, cliffY+r.ey*H*rp*.62);
    ctx.strokeStyle = burned?'rgba(35,14,4,.28)':'rgba(130,75,36,.22)';
    ctx.lineWidth = r.w*rp*.32; ctx.stroke();
  });
  ctx.restore();

  // ── TRUNK ──
  const tp = Math.min(p * 1.9, 1);
  const trunkH = H * 0.44 * tp;
  const trunkTop = cliffY - trunkH;
  const tw = W * 0.065;
  const sway = treeSwayAngle * trunkH * 0.5;

  if (trunkH > 3) {
    ctx.save();
    ctx.shadowColor = 'rgba(0,0,0,.7)'; ctx.shadowBlur = 14; ctx.shadowOffsetX = 4;
    ctx.beginPath();
    ctx.moveTo(W*0.5-tw, cliffY);
    ctx.bezierCurveTo(W*0.5-tw*.78+sway*.15, cliffY-trunkH*.32, W*0.5-tw*.56+sway*.55, cliffY-trunkH*.66, W*0.5-tw*.34+sway, trunkTop);
    ctx.lineTo(W*0.5+tw*.34+sway, trunkTop);
    ctx.bezierCurveTo(W*0.5+tw*.56+sway*.55, cliffY-trunkH*.66, W*0.5+tw*.78+sway*.15, cliffY-trunkH*.32, W*0.5+tw, cliffY);
    ctx.closePath();
    const tg = ctx.createLinearGradient(W*0.5-tw, 0, W*0.5+tw, 0);
    if (burned) { tg.addColorStop(0,'#0e0402'); tg.addColorStop(.4,'#1c0c06'); tg.addColorStop(.7,'#160a04'); tg.addColorStop(1,'#0a0302'); }
    else { tg.addColorStop(0,'#3a1c08'); tg.addColorStop(.22,'#8a5c3a'); tg.addColorStop(.5,'#a87048'); tg.addColorStop(.78,'#7a4828'); tg.addColorStop(1,'#3a1c08'); }
    ctx.fillStyle = tg; ctx.fill();
    if (!burned && trunkH > 28) {
      ctx.strokeStyle = 'rgba(28,10,3,.42)'; ctx.lineWidth = 1.5;
      for (let i=1;i<=5;i++){
        const by = cliffY-trunkH*(i*.16), bx = W*0.5+sway*(i*.2), bw = tw*(1-i*.055);
        ctx.beginPath(); ctx.moveTo(bx-bw+2,by+2); ctx.quadraticCurveTo(bx,by+5,bx+bw-2,by-1); ctx.stroke();
      }
    }
    ctx.restore();
  }
  if (p < 0.27) return;

  // ── BRANCHES ──
  const bp = Math.min((p-.25)/.36, 1);
  const bLen = W*0.34*bp;
  const bW = Math.max(2, tw*.44);
  const branchTip = W*0.5+sway;

  function drawBranch(x,y,a,l,w,d) {
    if (d===0||l<2.5) return;
    const windBend = ws*(5-d)*0.06*Math.sin(t*2+d*.6);
    const ex=x+Math.cos(a+windBend)*l, ey=y+Math.sin(a+windBend)*l;
    ctx.beginPath(); ctx.moveTo(x,y);
    ctx.quadraticCurveTo(x+Math.cos(a-.18)*l*.46, y+Math.sin(a-.18)*l*.46, ex, ey);
    ctx.strokeStyle = burned?`rgba(15,5,2,${.45+d*.07})`:`rgba(${46+d*10},${20+d*4},${5+d*2},${.5+d*.07})`;
    ctx.lineWidth = Math.max(.6,w); ctx.lineCap = 'round'; ctx.stroke();
    if (d>1) {
      const s=.28+d*.046;
      drawBranch(ex,ey,a-s-Math.random()*.07,l*.67,w*.6,d-1);
      drawBranch(ex,ey,a+s*.86+Math.random()*.07,l*.7,w*.58,d-1);
      if(d>2&&Math.random()>.4) drawBranch(ex,ey,a-.04+Math.random()*.18,l*.52,w*.46,d-2);
    }
  }

  const bDefs=[
    {a:-Math.PI/2-.5,sf:.06,lm:1.16},{a:-Math.PI/2+.42,sf:.13,lm:1.08},
    {a:-Math.PI/2-.76,sf:.27,lm:.95},{a:-Math.PI/2+.7,sf:.34,lm:.9},
    {a:-Math.PI/2-.14,sf:.01,lm:1.0},{a:-Math.PI/2+.16,sf:.40,lm:.86},
  ];
  bDefs.forEach(b=>{
    const by=trunkTop+trunkH*b.sf+sway*b.sf;
    drawBranch(branchTip,by,b.a,bLen*b.lm*(1-b.sf*.25),bW*(1-b.sf*.22),5);
  });
  if (p<0.48) return;

  // ── BLOSSOMS ──
  const flP=Math.min((p-.46)/.54,1);
  const tips=[];
  function collectT(x,y,a,l,d){
    const wb=ws*(5-d)*0.06*Math.sin(t*2+d*.6);
    const ex=x+Math.cos(a+wb)*l,ey=y+Math.sin(a+wb)*l;
    if(d<=1){tips.push({x:ex,y:ey,r:l*.94});return;}
    const s=.28+d*.046;
    collectT(ex,ey,a-s,l*.67,d-1); collectT(ex,ey,a+s*.86,l*.7,d-1);
    if(d>2) collectT(ex,ey,a-.04,l*.52,d-2);
  }
  bDefs.forEach(b=>{const by=trunkTop+trunkH*b.sf+sway*b.sf; collectT(branchTip,by,b.a,bLen*b.lm*(1-b.sf*.25),5);});

  if (burned) {
    tips.forEach(t2=>{
      if(Math.random()>.42)return;
      const g=ctx.createRadialGradient(t2.x,t2.y,0,t2.x,t2.y,t2.r*flP*1.3);
      g.addColorStop(0,'rgba(255,85,0,.72)'); g.addColorStop(1,'transparent');
      ctx.fillStyle=g; ctx.beginPath(); ctx.arc(t2.x,t2.y,t2.r*flP*1.3,0,Math.PI*2); ctx.fill();
    });
    return;
  }

  // glow
  tips.forEach(t2=>{
    const r=t2.r*flP; if(r<1.2)return;
    const g=ctx.createRadialGradient(t2.x,t2.y,0,t2.x,t2.y,r*3.2);
    g.addColorStop(0,'rgba(255,158,196,.22)'); g.addColorStop(.5,'rgba(255,100,160,.08)'); g.addColorStop(1,'transparent');
    ctx.fillStyle=g; ctx.beginPath(); ctx.arc(t2.x,t2.y,r*3.2,0,Math.PI*2); ctx.fill();
  });

  // flowers with wind sway
  tips.forEach(t2=>{
    const r=t2.r*flP; if(r<1.2)return;
    const cnt=Math.max(4,Math.floor(r*2.4));
    for(let i=0;i<cnt;i++){
      const ang=Math.random()*Math.PI*2;
      const windDrift=ws*Math.random()*r*.4;
      const dist=Math.random()*r*1.5;
      const fx=t2.x+Math.cos(ang)*dist+windDrift, fy=t2.y+Math.sin(ang)*dist;
      if(fy>H+8||fx<-10||fx>W+10)continue;
      const fr=1.8+Math.random()*5.2;
      ctx.save(); ctx.translate(fx,fy);
      ctx.rotate(Math.random()*Math.PI*2+ws*.5*Math.sin(t*2+fx*.01));
      for(let k=0;k<5;k++){
        const pa=(k/5)*Math.PI*2;
        ctx.beginPath(); ctx.ellipse(Math.cos(pa)*fr*.88,Math.sin(pa)*fr*.88,fr*.72,fr*.44,pa+Math.PI/2,0,Math.PI*2);
        const rnd=Math.random();
        ctx.fillStyle=rnd>.55?`rgba(255,${165+~~(Math.random()*60)},${188+~~(Math.random()*40)},.87)`:rnd>.26?`rgba(255,${136+~~(Math.random()*50)},${170+~~(Math.random()*38)},.88)`:`rgba(255,${206+~~(Math.random()*49)},${220+~~(Math.random()*35)},.92)`;
        ctx.fill();
      }
      ctx.beginPath(); ctx.arc(0,0,fr*.26,0,Math.PI*2); ctx.fillStyle='rgba(255,228,70,.95)'; ctx.fill();
      ctx.restore();
    }
  });

  // canopy glow
  if(flP>.3){
    const sg=ctx.createRadialGradient(branchTip,trunkTop-H*.04,0,branchTip,trunkTop-H*.04,W*.44);
    sg.addColorStop(0,`rgba(255,205,135,${.22*flP})`); sg.addColorStop(.38,`rgba(255,155,105,${.09*flP})`); sg.addColorStop(1,'transparent');
    ctx.fillStyle=sg; ctx.fillRect(0,0,W,H);
  }

  // drifting petals near tree
  if(flP>.25){
    for(let i=0;i<16;i++){
      const px=branchTip+(Math.random()-.5)*W*1.1+ws*30;
      const py=trunkTop+Math.random()*trunkH*1.4;
      if(py>H||px<-10||px>W+10)continue;
      ctx.save(); ctx.translate(px,py); ctx.rotate(Math.random()*Math.PI*2+ws);
      ctx.beginPath(); ctx.ellipse(0,0,4.5,2.8,0,0,Math.PI*2);
      ctx.fillStyle=`rgba(255,${152+~~(Math.random()*80)},${182+~~(Math.random()*40)},${.3+Math.random()*.45})`; ctx.fill();
      ctx.restore();
    }
  }
}

// ═══════════════════════════════════════════════════
//  SCENE: KATANA — Ghost of Tsushima style
// ═══════════════════════════════════════════════════

function drawKatanaScene(canvas, progress, burned, time) {
  const ctx = canvas.getContext('2d');
  const W = canvas.width, H = canvas.height;
  ctx.clearRect(0, 0, W, H);
  const p = Math.max(0, Math.min(1, progress));
  const t = time || 0;
  const ws = burned ? 0 : (0.5 + Math.sin(t * 0.8) * 0.3);

  // ── SKY — dark stormy ──
  const sky = ctx.createLinearGradient(0, 0, 0, H);
  if (burned) {
    sky.addColorStop(0, '#100205'); sky.addColorStop(1, '#060102');
  } else {
    sky.addColorStop(0, '#0a0c14');
    sky.addColorStop(0.3, '#0e1020');
    sky.addColorStop(0.6, '#0c0e1c');
    sky.addColorStop(1, '#060810');
  }
  ctx.fillStyle = sky; ctx.fillRect(0, 0, W, H);

  // storm clouds
  if (!burned) {
    const clouds = [
      {x:.1,y:.08,rx:180,ry:55,a:.7},
      {x:.6,y:.05,rx:150,ry:45,a:.65},
      {x:.35,y:.14,rx:120,ry:38,a:.6},
      {x:.82,y:.1,rx:100,ry:32,a:.55},
      {x:-.05,y:.18,rx:130,ry:40,a:.5},
    ];
    clouds.forEach(c => {
      ctx.save();
      const drift = Math.sin(t * 0.15 + c.x * 4) * 12;
      ctx.translate(c.x*W + drift, c.y*H);
      const cg = ctx.createRadialGradient(0, 0, 0, 0, 0, c.rx);
      cg.addColorStop(0, `rgba(30,35,50,${c.a})`);
      cg.addColorStop(0.6, `rgba(20,24,38,${c.a*.6})`);
      cg.addColorStop(1, 'transparent');
      ctx.scale(1, c.ry/c.rx);
      ctx.beginPath(); ctx.arc(0, 0, c.rx, 0, Math.PI*2);
      ctx.fillStyle = cg; ctx.fill();
      ctx.restore();
    });
  }

  // moonlight glow
  if (!burned) {
    const moonX = W * 0.72, moonY = H * 0.12;
    const mg = ctx.createRadialGradient(moonX, moonY, 0, moonX, moonY, W * 0.4);
    mg.addColorStop(0, 'rgba(200,210,240,0.12)');
    mg.addColorStop(0.4, 'rgba(150,165,210,0.06)');
    mg.addColorStop(1, 'transparent');
    ctx.fillStyle = mg; ctx.fillRect(0, 0, W, H);
    // moon circle
    ctx.beginPath(); ctx.arc(moonX, moonY, 22, 0, Math.PI*2);
    const moonGrad = ctx.createRadialGradient(moonX, moonY, 0, moonX, moonY, 24);
    moonGrad.addColorStop(0, 'rgba(220,225,245,0.9)');
    moonGrad.addColorStop(0.7, 'rgba(180,190,230,0.6)');
    moonGrad.addColorStop(1, 'transparent');
    ctx.fillStyle = moonGrad; ctx.fill();
  }

  // ── WIND STREAKS — horizontal strong ──
  if (!burned) {
    for (let i = 0; i < 14; i++) {
      const wy = H * (0.25 + Math.random() * 0.55);
      const wlen = 40 + Math.random() * 120;
      const wx = ((W * (i / 14) + t * ws * 220 + i * 67) % (W + 150)) - 50;
      const wa = 0.05 + Math.random() * 0.18;
      const wg = ctx.createLinearGradient(wx, wy, wx + wlen, wy);
      wg.addColorStop(0, 'transparent');
      wg.addColorStop(0.35, `rgba(200,210,240,${wa})`);
      wg.addColorStop(0.65, `rgba(180,195,230,${wa * 0.7})`);
      wg.addColorStop(1, 'transparent');
      ctx.strokeStyle = wg; ctx.lineWidth = 0.5 + Math.random() * 1.2;
      ctx.beginPath(); ctx.moveTo(wx, wy);
      ctx.bezierCurveTo(wx+wlen*.3, wy+(Math.random()-.5)*3, wx+wlen*.7, wy+(Math.random()-.5)*3, wx+wlen, wy+(Math.random()-.5)*2);
      ctx.stroke();
    }
    // dust swirls
    for (let i = 0; i < 6; i++) {
      const sx = ((W * 0.3 + i * 120 + t * ws * 80) % (W + 100)) - 50;
      const sy = H * (0.55 + Math.random() * 0.25);
      const sr = 8 + Math.random() * 18;
      ctx.save(); ctx.translate(sx, sy);
      ctx.rotate(t * 1.5 + i);
      const sg = ctx.createRadialGradient(0, 0, 0, 0, 0, sr);
      sg.addColorStop(0, `rgba(180,190,220,${0.06 + Math.random()*0.06})`);
      sg.addColorStop(1, 'transparent');
      ctx.beginPath(); ctx.arc(0, 0, sr, 0, Math.PI*2);
      ctx.fillStyle = sg; ctx.fill();
      ctx.restore();
    }
  }

  // ── GRASS ──
  const grassY = H * 0.72;
  const grassH = H * 0.28;

  // background grass layer
  drawGrassLayer(ctx, W, H, grassY, grassH, ws, t, 0.6, 'rgba(140,150,140,0.35)', 18, 0.5);
  // mid grass
  drawGrassLayer(ctx, W, H, grassY+H*0.02, grassH*0.9, ws, t, 0.8, 'rgba(160,170,155,0.55)', 22, 0.65);
  // foreground grass
  drawGrassLayer(ctx, W, H, grassY+H*0.06, grassH*0.75, ws*1.2, t, 1.0, 'rgba(185,195,175,0.75)', 28, 0.8);

  // ground fog
  const fog = ctx.createLinearGradient(0, grassY - H*0.02, 0, grassY + H*0.08);
  fog.addColorStop(0, 'transparent');
  fog.addColorStop(0.4, `rgba(150,160,185,${burned?0.04:0.1})`);
  fog.addColorStop(1, 'transparent');
  ctx.fillStyle = fog; ctx.fillRect(0, grassY - H*0.02, W, H*0.1);

  // ── KATANA ──
  if (p > 0.02) {
    const katP = Math.min(p * 2.2, 1);
    drawKatana(ctx, W, H, grassY, katP, burned, t, ws);
  }

  // snow/ash particles
  if (!burned) {
    for (let i = 0; i < 20; i++) {
      const px = ((i * 137 + t * ws * 60 + i * 50) % (W + 20)) - 10;
      const py = (H * (i / 20) + t * 20 + i * 30) % H;
      const pr = 1 + Math.random() * 2;
      const pa = 0.15 + Math.random() * 0.4;
      ctx.beginPath(); ctx.arc(px, py, pr, 0, Math.PI*2);
      ctx.fillStyle = `rgba(200,210,230,${pa})`; ctx.fill();
    }
  }
}

function drawGrassLayer(ctx, W, H, baseY, grassH, ws, t, scale, color, bladeCount, alpha) {
  ctx.save(); ctx.globalAlpha = alpha;
  for (let i = 0; i < bladeCount; i++) {
    const bx = (W / bladeCount) * i + (Math.random() - 0.5) * (W / bladeCount);
    const bh = grassH * (0.5 + Math.random() * 0.6) * scale;
    const phase = i * 0.8 + t * (1.2 + Math.random() * 0.5);
    const sway = ws * bh * 0.18 * Math.sin(phase);
    const tipX = bx + sway;
    const tipY = baseY - bh;
    const midSway = sway * 0.5;

    ctx.beginPath();
    ctx.moveTo(bx, baseY);
    ctx.bezierCurveTo(
      bx + midSway * 0.3, baseY - bh * 0.35,
      bx + midSway * 0.7, baseY - bh * 0.65,
      tipX, tipY
    );
    ctx.strokeStyle = color;
    ctx.lineWidth = 1.5 + Math.random() * 1.5;
    ctx.lineCap = 'round'; ctx.stroke();

    // feathery tip
    if (bh > 40) {
      const featherCount = 3 + Math.floor(Math.random() * 4);
      for (let f = 0; f < featherCount; f++) {
        const fa = (f / featherCount - 0.5) * 0.8;
        const fl = bh * 0.15;
        const fx = tipX + Math.cos(fa + Math.PI/2 + sway*0.01) * fl;
        const fy = tipY + Math.sin(fa + Math.PI/2) * fl;
        ctx.beginPath(); ctx.moveTo(tipX, tipY); ctx.lineTo(fx, fy);
        ctx.strokeStyle = color; ctx.lineWidth = 0.8; ctx.stroke();
      }
    }
  }
  ctx.globalAlpha = 1; ctx.restore();
}

function drawKatana(ctx, W, H, grassY, progress, burned, time, ws) {
  const cx = W * 0.62;
  const bladeAngle = -0.28; // slight tilt like GoT
  const bladeLen = H * 0.55 * progress;

  // katana tip position (in grass)
  const tipX = cx;
  const tipY = grassY + H * 0.08;

  // blade endpoint (up)
  const endX = tipX + Math.cos(bladeAngle - Math.PI/2) * bladeLen;
  const endY = tipY + Math.sin(bladeAngle - Math.PI/2) * bladeLen;

  // sway
  const swayX = ws * 3 * Math.sin(time * 1.1);

  ctx.save();
  ctx.translate(swayX * 0.3, 0);

  // ── BLADE GLOW ──
  if (!burned) {
    const glowG = ctx.createLinearGradient(tipX, tipY, endX, endY);
    glowG.addColorStop(0, 'rgba(150,200,255,0)');
    glowG.addColorStop(0.3, `rgba(180,220,255,${0.15*progress})`);
    glowG.addColorStop(0.7, `rgba(200,230,255,${0.25*progress})`);
    glowG.addColorStop(1, `rgba(220,240,255,${0.12*progress})`);
    ctx.strokeStyle = glowG; ctx.lineWidth = 18; ctx.lineCap = 'round';
    ctx.beginPath(); ctx.moveTo(tipX, tipY); ctx.lineTo(endX, endY); ctx.stroke();

    // secondary glow
    ctx.strokeStyle = `rgba(200,230,255,${0.08*progress})`;
    ctx.lineWidth = 32; ctx.beginPath(); ctx.moveTo(tipX, tipY); ctx.lineTo(endX, endY); ctx.stroke();
  }

  // ── BLADE ──
  // edge highlight
  const bladeEdgeG = ctx.createLinearGradient(tipX, tipY, endX, endY);
  if (burned) {
    bladeEdgeG.addColorStop(0, 'rgba(30,20,10,0.9)');
    bladeEdgeG.addColorStop(1, 'rgba(20,12,6,0.7)');
  } else {
    bladeEdgeG.addColorStop(0, 'rgba(180,195,215,0.9)');
    bladeEdgeG.addColorStop(0.5, 'rgba(220,235,255,0.95)');
    bladeEdgeG.addColorStop(1, 'rgba(160,180,210,0.85)');
  }

  // blade thickness gradient (thicker at base)
  const bladeG = ctx.createLinearGradient(tipX-5, 0, tipX+5, 0);
  if (!burned) {
    bladeG.addColorStop(0, 'rgba(140,155,175,0.95)');
    bladeG.addColorStop(0.3, 'rgba(210,225,245,0.98)');
    bladeG.addColorStop(0.6, 'rgba(230,240,255,1)');
    bladeG.addColorStop(1, 'rgba(160,175,200,0.9)');
  } else {
    bladeG.addColorStop(0, 'rgba(20,15,10,0.9)');
    bladeG.addColorStop(0.5, 'rgba(35,25,15,0.95)');
    bladeG.addColorStop(1, 'rgba(18,12,8,0.85)');
  }

  // draw blade as tapered path
  const perpX = Math.sin(bladeAngle - Math.PI/2);
  const perpY = -Math.cos(bladeAngle - Math.PI/2);
  const baseW = 8, tipW = 1.5;

  ctx.beginPath();
  ctx.moveTo(tipX + perpX * tipW, tipY + perpY * tipW);
  ctx.lineTo(tipX - perpX * tipW, tipY - perpY * tipW);
  ctx.lineTo(endX - perpX * baseW, endY - perpY * baseW);
  ctx.lineTo(endX + perpX * baseW, endY + perpY * baseW);
  ctx.closePath();
  ctx.fillStyle = bladeG; ctx.fill();

  // edge line
  ctx.strokeStyle = bladeEdgeG; ctx.lineWidth = 1.2; ctx.stroke();

  // fuller (groove on blade)
  if (!burned) {
    ctx.strokeStyle = 'rgba(100,120,150,0.4)'; ctx.lineWidth = 1;
    ctx.beginPath();
    ctx.moveTo(tipX + perpX*0.5, tipY + perpY*0.5);
    ctx.lineTo(endX + perpX*3, endY + perpY*3);
    ctx.stroke();
  }

  if (progress < 0.35) { ctx.restore(); return; }

  // ── TSUBA (GUARD) ── custom design - not GoT
  const guardY = endY + H * 0.02;
  const guardX = endX;
  const guardP = Math.min((progress - 0.35) / 0.2, 1);

  ctx.globalAlpha = guardP;

  // octagonal guard (custom, not GoT)
  ctx.save();
  ctx.translate(guardX, guardY);
  ctx.rotate(bladeAngle + Math.PI/2);
  const gSize = 14 + guardP * 2;
  ctx.beginPath();
  for (let k = 0; k < 8; k++) {
    const ka = (k / 8) * Math.PI * 2;
    const kx = Math.cos(ka) * gSize;
    const ky = Math.sin(ka) * gSize * 0.35;
    k === 0 ? ctx.moveTo(kx, ky) : ctx.lineTo(kx, ky);
  }
  ctx.closePath();
  const guardG = ctx.createRadialGradient(0, 0, 0, 0, 0, gSize);
  if (burned) { guardG.addColorStop(0,'#1a1008'); guardG.addColorStop(1,'#0e0806'); }
  else { guardG.addColorStop(0,'#3a3028'); guardG.addColorStop(0.6,'#1e1810'); guardG.addColorStop(1,'#140e08'); }
  ctx.fillStyle = guardG; ctx.fill();
  ctx.strokeStyle = burned?'rgba(40,25,10,0.8)':'rgba(120,95,60,0.8)';
  ctx.lineWidth = 1.5; ctx.stroke();
  // center circle
  ctx.beginPath(); ctx.arc(0, 0, 3, 0, Math.PI*2);
  ctx.fillStyle = burned?'#0e0806':'rgba(180,145,80,0.9)'; ctx.fill();
  ctx.restore();

  if (progress < 0.5) { ctx.globalAlpha = 1; ctx.restore(); return; }

  // ── HANDLE (TSUKA) ── black with wrap
  const handleP = Math.min((progress - 0.5) / 0.25, 1);
  ctx.globalAlpha = guardP * handleP;

  const handleLen = H * 0.14 * handleP;
  const hEndX = guardX + Math.cos(bladeAngle + Math.PI/2) * handleLen;
  const hEndY = guardY + Math.sin(bladeAngle + Math.PI/2) * handleLen;

  // handle base
  const hW = 7;
  ctx.beginPath();
  ctx.moveTo(guardX + perpX*hW*1.1, guardY + perpY*hW*1.1);
  ctx.lineTo(guardX - perpX*hW*1.1, guardY - perpY*hW*1.1);
  ctx.lineTo(hEndX - perpX*hW*0.7, hEndY - perpY*hW*0.7);
  ctx.lineTo(hEndX + perpX*hW*0.7, hEndY + perpY*hW*0.7);
  ctx.closePath();
  ctx.fillStyle = burned?'#0a0604':'#0e0c0a'; ctx.fill();

  // wrapping (tsuka-ito) - black cord
  const wrapCount = 6;
  for (let w = 0; w < wrapCount; w++) {
    const wt = (w + 0.5) / wrapCount;
    const wx = guardX + (hEndX-guardX)*wt;
    const wy = guardY + (hEndY-guardY)*wt;
    ctx.beginPath();
    ctx.moveTo(wx + perpX*(hW*1.0), wy + perpY*(hW*1.0));
    ctx.lineTo(wx - perpX*(hW*1.0), wy - perpY*(hW*1.0));
    ctx.strokeStyle = burned?'rgba(15,10,6,0.8)':'rgba(20,18,14,0.85)';
    ctx.lineWidth = 2.5; ctx.stroke();
    // diamond pattern
    ctx.strokeStyle = burned?'rgba(25,15,8,0.5)':'rgba(50,40,30,0.6)';
    ctx.lineWidth = 0.8;
    ctx.beginPath();
    ctx.moveTo(wx + perpX*hW*.4, wy + perpY*hW*.4);
    ctx.lineTo(wx - perpX*hW*.4, wy - perpY*hW*.4);
    ctx.stroke();
  }

  // pommel (kashira) - round end
  ctx.beginPath(); ctx.arc(hEndX, hEndY, hW * 0.8, 0, Math.PI*2);
  const pommelG = ctx.createRadialGradient(hEndX-2, hEndY-2, 0, hEndX, hEndY, hW);
  if (burned) { pommelG.addColorStop(0,'#1a1208'); pommelG.addColorStop(1,'#0a0806'); }
  else { pommelG.addColorStop(0,'#2a2420'); pommelG.addColorStop(0.6,'#1a1612'); pommelG.addColorStop(1,'#0e0c0a'); }
  ctx.fillStyle = pommelG; ctx.fill();
  ctx.strokeStyle = burned?'rgba(30,20,10,0.6)':'rgba(80,65,45,0.7)';
  ctx.lineWidth = 1.2; ctx.stroke();

  ctx.globalAlpha = 1;
  ctx.restore();

  // katana ground glow
  if (!burned && progress > 0.3) {
    const kg = ctx.createRadialGradient(tipX, tipY, 0, tipX, tipY, 40);
    kg.addColorStop(0, `rgba(150,200,255,${0.15*progress})`);
    kg.addColorStop(1, 'transparent');
    ctx.fillStyle = kg;
    ctx.beginPath(); ctx.arc(tipX, tipY, 40, 0, Math.PI*2); ctx.fill();
  }
}

function lerpC(a,b,t){
  const ah=a.replace('#',''),bh=b.replace('#','');
  const r=(h,i)=>parseInt(h.slice(i,i+2),16);
  const lr=(a,b,t)=>Math.round(a+(b-a)*Math.max(0,Math.min(1,t)));
  const rr=lr(r(ah,0),r(bh,0),t),rg=lr(r(ah,2),r(bh,2),t),rb=lr(r(ah,4),r(bh,4),t);
  return `#${rr.toString(16).padStart(2,'0')}${rg.toString(16).padStart(2,'0')}${rb.toString(16).padStart(2,'0')}`;
}

// ── MAIN CANVAS LOOP ──
const mainCanvas = document.getElementById('mainCanvas');
const mCtx = mainCanvas.getContext('2d');
let sceneRunning = false, sceneAnimId = null, sceneTime = 0;

function resizeCanvas(){
  mainCanvas.width = window.innerWidth;
  mainCanvas.height = window.innerHeight;
}
resizeCanvas();
window.addEventListener('resize', resizeCanvas);

function runScene(){
  if(!sceneRunning)return;
  sceneTime += 0.016;
  updateWind();
  if(currentScene==='sakura') drawSakuraScene(mainCanvas,treeP,false,sceneTime);
  else drawKatanaScene(mainCanvas,treeP,false,sceneTime);
  sceneAnimId=requestAnimationFrame(runScene);
}
function startScene(){sceneRunning=true;resizeCanvas();runScene();}
function stopScene(){sceneRunning=false;cancelAnimationFrame(sceneAnimId);}

// ── FIRE ──
let fireRunning=false, fireAnimId2=null;
let fireCanvas2=null, fCtx2=null, fireParts=[];

class FP{
  constructor(){this.reset();}
  reset(){
    const cx=mainCanvas.width*.5, sp=mainCanvas.width*.38;
    this.x=cx+(Math.random()-.5)*sp*2;
    this.y=mainCanvas.height*(0.58+Math.random()*.28);
    this.vx=(Math.random()-.5)*1.8;this.vy=-(1.6+Math.random()*3.4);
    this.life=0;this.maxLife=55+~~(Math.random()*75);
    this.size=8+Math.random()*22;this.ember=Math.random()>.72;
  }
  update(){
    this.life++;this.x+=this.vx+Math.sin(this.life*.18)*.7;this.y+=this.vy;
    this.vy*=.987;this.vx*=.979;this.size*=.989;
    if(this.life>=this.maxLife||this.size<.4)this.reset();
  }
  draw(ctx){
    const t2=this.life/this.maxLife;
    const a=t2<.15?t2/.15:t2>.72?1-(t2-.72)/.28:1;
    if(this.ember){
      const r=this.size*.3,g=ctx.createRadialGradient(this.x,this.y,0,this.x,this.y,r*2.5);
      g.addColorStop(0,`rgba(255,240,180,${a})`);g.addColorStop(.5,`rgba(255,140,0,${a*.6})`);g.addColorStop(1,'rgba(255,40,0,0)');
      ctx.beginPath();ctx.arc(this.x,this.y,r*2.5,0,Math.PI*2);ctx.fillStyle=g;ctx.fill();
    } else {
      const g=ctx.createRadialGradient(this.x,this.y,0,this.x,this.y+this.size*.3,this.size*1.1);
      g.addColorStop(0,`rgba(255,255,200,${a*.95})`);g.addColorStop(.3,`rgba(255,220,50,${a*.88})`);
      g.addColorStop(.6,`rgba(255,100,0,${a*.7})`);g.addColorStop(1,'rgba(100,0,0,0)');
      ctx.save();ctx.translate(this.x,this.y);ctx.scale(1,1.65+Math.sin(this.life*.12)*.18);
      ctx.beginPath();ctx.arc(0,0,this.size,0,Math.PI*2);ctx.fillStyle=g;ctx.fill();ctx.restore();
    }
  }
}

function startFire2(){
  fireRunning=true;
  if(!fireCanvas2){
    fireCanvas2=document.createElement('canvas');
    fireCanvas2.style.cssText='position:absolute;inset:0;width:100%;height:100%;z-index:5;pointer-events:none';
    document.getElementById('sFocus').appendChild(fireCanvas2);
    fCtx2=fireCanvas2.getContext('2d');
  }
  fireCanvas2.width=window.innerWidth;fireCanvas2.height=window.innerHeight;
  fireParts=[];
  for(let i=0;i<140;i++){const fp=new FP();fp.life=~~(Math.random()*fp.maxLife);fireParts.push(fp);}
  animFire2();
}
function animFire2(){
  if(!fireRunning)return;
  fCtx2.clearRect(0,0,fireCanvas2.width,fireCanvas2.height);
  const cx=fireCanvas2.width*.5,by=fireCanvas2.height*.75;
  const bg=fCtx2.createRadialGradient(cx,by,0,cx,by,fireCanvas2.width*.45);
  bg.addColorStop(0,'rgba(255,110,0,0.15)');bg.addColorStop(.5,'rgba(180,40,0,0.07)');bg.addColorStop(1,'transparent');
  fCtx2.fillStyle=bg;fCtx2.fillRect(0,0,fireCanvas2.width,fireCanvas2.height);
  fireParts.forEach(p=>{p.update();p.draw(fCtx2);});
  fireAnimId2=requestAnimationFrame(animFire2);
}
function stopFire2(){
  fireRunning=false;cancelAnimationFrame(fireAnimId2);
  if(fCtx2)fCtx2.clearRect(0,0,fireCanvas2.width,fireCanvas2.height);
}

// ── PETALS ──
let petalIv=null;
function startPetals(){
  if(petalIv)return;
  const layer=document.getElementById('petalLayer');
  petalIv=setInterval(()=>{
    if(treeP<0.35)return;
    const count=treeP>.7?3:treeP>.5?2:1;
    for(let n=0;n<count;n++){
      const el=document.createElement('div');el.className='pk';
      const pink=146+~~(Math.random()*84);
      el.innerHTML=`<svg width="${8+~~(Math.random()*8)}" height="${6+~~(Math.random()*6)}" viewBox="0 0 11 8"><ellipse cx="5.5" cy="4" rx="4.8" ry="3" fill="rgba(255,${pink},176,${.7+Math.random()*.25})" transform="rotate(${Math.random()*360} 5.5 4)"/></svg>`;
      el.style.left=Math.random()*100+'%';
      const d=4+Math.random()*8;el.style.animationDuration=d+'s';el.style.animationDelay=(Math.random()*1.5)+'s';
      layer.appendChild(el);setTimeout(()=>el.remove(),(d+3)*1000);
    }
  },300);
}
function stopPetals(){clearInterval(petalIv);petalIv=null;document.getElementById('petalLayer').innerHTML='';}

// ── SNOW ──
let snowIv=null;
function startSnow(){
  if(snowIv)return;
  const layer=document.getElementById('snowLayer');
  snowIv=setInterval(()=>{
    const el=document.createElement('div');el.className='snowflake';
    el.innerHTML=`<svg width="4" height="4" viewBox="0 0 4 4"><circle cx="2" cy="2" r="1.5" fill="rgba(200,215,235,${.3+Math.random()*.5})"/></svg>`;
    el.style.left=Math.random()*110-5+'%';
    const d=3+Math.random()*6;el.style.animationDuration=d+'s';el.style.animationDelay=(Math.random()*2)+'s';
    layer.appendChild(el);setTimeout(()=>el.remove(),(d+3)*1000);
  },200);
}
function stopSnow(){clearInterval(snowIv);snowIv=null;document.getElementById('snowLayer').innerHTML='';}

// ── STATE ──
let focusMins=25,breakMins=5,totalSess=2;
let curSess=1,isWork=true,remaining=0,totalSec=0;
let treeP=0,iv=null,armed=false;
let currentScene='sakura';

function selectScene(name){
  currentScene=name;
  document.querySelectorAll('.scene-card').forEach(c=>c.classList.remove('active'));
  document.getElementById('scene-'+name).classList.add('active');
  document.getElementById('start-btn-label').textContent=name==='katana'?'⚔️ ПРИСТУПАЮ':'🌱 ПРИСТУПАЮ';
}

function onSlide(){
  focusMins=+document.getElementById('rF').value;
  breakMins=+document.getElementById('rB').value;
  totalSess=+document.getElementById('rS').value;
  document.getElementById('vF').textContent=focusMins+' мин';
  document.getElementById('vB').textContent=breakMins+' мин';
  document.getElementById('vS').textContent=totalSess;
}

function startFocus(){
  curSess=1;isWork=true;treeP=0;armed=false;
  sceneTime=0;windStr=0.4;
  stopFire2();stopScene();
  show('sFocus');
  startScene();
  if(currentScene==='sakura'){startPetals();stopSnow();}
  else{startSnow();stopPetals();}
  beginPhase();
}

function beginPhase(){
  clearInterval(iv);
  totalSec=(isWork?focusMins:breakMins)*60;
  remaining=totalSec;
  refreshUI();
  iv=setInterval(tick,1000);
}

const HINTS=['Сосредоточься, Глеб 🌸','Ты в потоке 🌊','Сцена оживает...','Не отвлекайся 💪','Ещё немного!'];
const HINTS_K=['Путь самурая...⚔️','Концентрация — сила','Держись, воин','Не отвлекайся','Финал близко'];

function tick(){
  remaining=Math.max(0,remaining-1);
  if(isWork){
    const done=(curSess-1)*focusMins*60+(focusMins*60-remaining);
    treeP=Math.min(done/(totalSess*focusMins*60),1);
  }
  refreshUI();
  if(remaining<=0){
    clearInterval(iv);
    if(isWork&&curSess>=totalSess)setTimeout(finishWin,500);
    else if(isWork){isWork=false;beginPhase();}
    else{curSess++;isWork=true;beginPhase();}
  }
}

function refreshUI(){
  const m=~~(remaining/60),s=remaining%60;
  const ts=`${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}`;
  document.getElementById('tNum').textContent=ts;
  document.getElementById('tNum').className='t-num '+(isWork?'work':'rest');
  document.getElementById('tPhase').textContent=isWork?'ФОКУС':'ПЕРЕРЫВ';
  document.getElementById('tPhase').className='t-phase '+(isWork?'work':'rest');
  const hints=currentScene==='katana'?HINTS_K:HINTS;
  document.getElementById('tHint').textContent=isWork?hints[Math.min(~~((1-remaining/totalSec)*hints.length),hints.length-1)]:'Отдохни ☕';
  document.getElementById('sessBadge').textContent=`Сессия ${curSess}/${totalSess}`;
  const btn=document.getElementById('qBtn');
  if(isWork){btn.className='quit-btn work';if(!armed){btn.textContent='🔥 СДАТЬСЯ';btn.style.fontSize='';}btn.disabled=false;}
  else{btn.className='quit-btn rest';btn.textContent=`☕ ПЕРЕРЫВ  ${ts}`;btn.disabled=true;armed=false;}
}

function onQuit(){
  if(!isWork)return;
  if(!armed){
    armed=true;const btn=document.getElementById('qBtn');
    btn.textContent='❗ Ещё раз — сцена сгорит';btn.style.fontSize='11px';
    setTimeout(()=>{if(armed){armed=false;btn.textContent='🔥 СДАТЬСЯ';btn.style.fontSize='';}},2800);
    return;
  }
  armed=false;clearInterval(iv);stopPetals();stopSnow();
  // burn scene
  sceneRunning=false;cancelAnimationFrame(sceneAnimId);
  if(currentScene==='sakura')drawSakuraScene(mainCanvas,treeP,true,sceneTime);
  else drawKatanaScene(mainCanvas,treeP,true,sceneTime);
  startFire2();
  setTimeout(()=>{
    stopFire2();
    const lc=document.getElementById('loseCanvas');lc.width=280;lc.height=220;
    if(currentScene==='sakura')drawSakuraScene(lc,treeP,true,sceneTime);
    else drawKatanaScene(lc,treeP,true,sceneTime);
    show('sLose');
  },3500);
}

function finishWin(){
  stopPetals();stopSnow();stopScene();
  const xp=totalSess*focusMins*2;
  document.getElementById('winXp').textContent=`+${xp} XP ⚡`;
  const wc=document.getElementById('winCanvas');wc.width=280;wc.height=220;
  if(currentScene==='sakura')drawSakuraScene(wc,1.0,false,2.5);
  else drawKatanaScene(wc,1.0,false,2.5);
  try{const c=JSON.parse(localStorage.getItem('xp_total')||'0');localStorage.setItem('xp_total',JSON.stringify(c+xp));}catch(e){}
  show('sWin');
}

function openSettings(){clearInterval(iv);stopPetals();stopSnow();stopScene();stopFire2();armed=false;show('sSettings');}
function show(id){document.querySelectorAll('.screen').forEach(s=>s.classList.remove('active'));document.getElementById(id).classList.add('active');}
function goHome(){window.location.href='index.html';}

onSlide();
</script>
