<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Фокус</title>
<link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@400;600;700;900&family=Golos+Text:wght@400;500;600&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html,body{width:100%;height:100%;overflow:hidden;background:#06041a;}
body{font-family:'Golos Text',sans-serif;color:#f0e8ff;}
.screen{display:none;width:100%;height:100vh;flex-direction:column;overflow:hidden;}
.screen.active{display:flex;}

/* SETTINGS */
#sSettings{background:linear-gradient(180deg,#0d0a28,#130e38 60%,#0d0a28);overflow-y:auto;align-items:center;padding:52px 20px 32px;gap:14px;}
.set-back{align-self:flex-start;color:#6050a0;font-size:13px;cursor:pointer;text-decoration:underline;}
.set-label{font-family:'Unbounded',sans-serif;font-size:11px;font-weight:600;letter-spacing:.2em;color:#6050a0;text-transform:uppercase;}
.set-title{font-family:'Unbounded',sans-serif;font-size:22px;font-weight:700;text-align:center;background:linear-gradient(135deg,#f0e8ff,#ffb3cc);-webkit-background-clip:text;-webkit-text-fill-color:transparent;}
.preview-wrap{width:100%;max-width:280px;aspect-ratio:9/16;border-radius:16px;overflow:hidden;position:relative;background:#0a0e18;}
.preview-wrap img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;transition:opacity 0.6s ease;}
.sliders{width:100%;display:flex;flex-direction:column;gap:10px;}
.scard{background:rgba(255,255,255,0.06);border:1px solid rgba(255,255,255,0.1);border-radius:16px;padding:16px 18px;}
.srow{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;}
.sname{font-size:14px;font-weight:500;}
.sval{font-family:'Unbounded',sans-serif;font-size:16px;font-weight:700;color:#ff6b9d;}
input[type=range]{width:100%;-webkit-appearance:none;height:5px;border-radius:5px;background:rgba(255,255,255,0.12);outline:none;cursor:pointer;}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:24px;height:24px;border-radius:50%;background:linear-gradient(135deg,#ff6b9d,#c44dff);box-shadow:0 0 12px rgba(255,107,157,.5);cursor:pointer;}
.start-btn{width:100%;background:linear-gradient(135deg,#ff6b9d,#c44dff);border:none;border-radius:18px;padding:18px;color:#fff;font-family:'Unbounded',sans-serif;font-size:14px;font-weight:700;letter-spacing:.08em;cursor:pointer;box-shadow:0 8px 30px rgba(255,107,157,.4);}
.start-btn:active{opacity:.88;transform:scale(.97);}

/* FOCUS */
#sFocus{position:relative;}

/* SAKURA FRAMES */
.sakura-scene{position:absolute;inset:0;z-index:0;}
.sakura-scene img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:center bottom;opacity:0;transition:opacity 0.9s ease-in-out;will-change:opacity;}
.sakura-scene img.visible{opacity:1;}

/* SKY OVERLAY — changes colour with progress */
.sky-overlay{position:absolute;inset:0;z-index:1;pointer-events:none;transition:background 4s ease;}

/* EFFECTS CANVAS — wind, clouds drawn here */
#fxCanvas{position:absolute;inset:0;width:100%;height:100%;z-index:2;pointer-events:none;}

/* BURN */
.burn-overlay{position:absolute;inset:0;z-index:3;background:linear-gradient(180deg,rgba(160,30,0,0) 0%,rgba(220,60,0,0.65) 55%,rgba(255,90,0,0.45) 100%);opacity:0;transition:opacity 1s ease;pointer-events:none;}
.burn-overlay.active{opacity:1;}

/* PETALS */
.petal-layer{position:absolute;inset:0;overflow:hidden;pointer-events:none;z-index:4;}
.pk{position:absolute;top:-18px;opacity:0;animation:pfall linear infinite;}
@keyframes pfall{
  0%{opacity:0;transform:translateY(0) rotate(0deg) translateX(0);}
  8%{opacity:.9;}
  88%{opacity:.6;}
  100%{opacity:0;transform:translateY(110vh) rotate(520deg) translateX(100px);}
}

/* FIRE */
#fireCanvas{position:absolute;inset:0;width:100%;height:100%;z-index:5;pointer-events:none;opacity:0;transition:opacity .3s;}
#fireCanvas.active{opacity:1;}

/* VIGNETTE */
.vignette{position:absolute;inset:0;z-index:6;pointer-events:none;background:radial-gradient(ellipse at center,transparent 40%,rgba(0,0,0,0.5) 100%);animation:breathe 7s ease-in-out infinite;}
@keyframes breathe{0%,100%{opacity:.7}50%{opacity:1}}

/* UI */
.focus-ui{position:absolute;inset:0;z-index:10;display:flex;flex-direction:column;justify-content:space-between;padding:52px 20px 36px;pointer-events:none;}
.focus-ui>*{pointer-events:all;}
.f-top{display:flex;justify-content:space-between;align-items:center;}
.sess-badge{font-family:'Unbounded',sans-serif;font-size:11px;font-weight:600;letter-spacing:.1em;color:rgba(240,232,255,.75);background:rgba(6,4,26,.6);border:1px solid rgba(255,255,255,.15);border-radius:20px;padding:6px 14px;backdrop-filter:blur(8px);}
.set-ico{width:36px;height:36px;border-radius:12px;background:rgba(6,4,26,.6);border:1px solid rgba(255,255,255,.15);display:flex;align-items:center;justify-content:center;font-size:16px;cursor:pointer;backdrop-filter:blur(8px);}
.f-mid{flex:1;pointer-events:none;}
.f-bottom{display:flex;flex-direction:column;align-items:center;gap:10px;}
.quit-btn{width:100%;border:none;border-radius:16px;padding:15px;font-family:'Unbounded',sans-serif;font-size:13px;font-weight:700;letter-spacing:.06em;cursor:pointer;transition:all .35s;backdrop-filter:blur(14px);}
.quit-btn.work{background:rgba(140,20,20,.35);border:1px solid rgba(255,80,80,.5);color:#ff9090;}
.quit-btn.rest{background:rgba(100,50,200,.35);border:1px solid rgba(160,110,255,.5);color:#c0a8ff;}
.quit-btn:active{transform:scale(.96);}
.t-phase{font-family:'Unbounded',sans-serif;font-size:10px;font-weight:600;letter-spacing:.2em;text-transform:uppercase;text-align:center;}
.t-phase.work{color:rgba(255,200,215,.7);}
.t-phase.rest{color:rgba(180,215,255,.7);}
.t-num{font-family:'Unbounded',sans-serif;font-size:40px;font-weight:900;line-height:1;letter-spacing:-.02em;text-align:center;text-shadow:0 0 30px rgba(255,150,190,.5),0 2px 14px rgba(0,0,0,.9);}
.t-num.work{color:rgba(255,242,248,.92);}
.t-num.rest{color:rgba(200,228,255,.92);}
.t-hint{font-size:11px;color:rgba(200,185,240,.42);margin-top:2px;text-align:center;}

/* END */
.end-screen{background:linear-gradient(180deg,#0d0a28,#130e38,#0d0a28);align-items:center;justify-content:center;text-align:center;padding:60px 24px 40px;overflow-y:auto;}
.end-icon{font-size:58px;margin-bottom:14px;animation:pop .5s cubic-bezier(.34,1.56,.64,1);}
@keyframes pop{from{transform:scale(0)}to{transform:scale(1)}}
.end-title{font-family:'Unbounded',sans-serif;font-size:22px;font-weight:900;margin-bottom:8px;}
.end-title.win{background:linear-gradient(135deg,#ffb3cc,#c44dff);-webkit-background-clip:text;-webkit-text-fill-color:transparent;}
.end-title.lose{color:#ff7070;}
.end-sub{font-size:14px;color:#6050a0;line-height:1.6;margin-bottom:10px;}
.end-xp{font-family:'Unbounded',sans-serif;font-size:30px;font-weight:900;color:#fde047;margin-bottom:16px;}
.end-img-wrap{width:min(200px,70vw);aspect-ratio:9/16;border-radius:16px;overflow:hidden;margin:0 auto 22px;}
.end-img-wrap img{width:100%;height:100%;object-fit:cover;}
.end-img-wrap.burned img{filter:grayscale(.55) sepia(.6) hue-rotate(-15deg) brightness(.5);}
.end-btn{width:100%;border:none;border-radius:16px;padding:16px;color:#fff;font-family:'Unbounded',sans-serif;font-size:13px;font-weight:700;cursor:pointer;}
.end-btn.win{background:linear-gradient(135deg,#ff6b9d,#c44dff);box-shadow:0 8px 28px rgba(255,107,157,.4);}
.end-btn.lose{background:linear-gradient(135deg,#ff6b6b,#cc2200);}
</style>
</head>
<body>

<!-- SETTINGS -->
<div class="screen active" id="sSettings">
  <div class="set-back" onclick="goHome()">← К задачам</div>
  <div class="set-label">режим фокуса</div>
  <div class="set-title">Посади сакуру 🌸</div>
  <div class="preview-wrap">
    <img src="frame0.PNG" style="opacity:1" id="prev0">
    <img src="frame5.PNG" style="opacity:0" id="prev5">
  </div>
  <div class="sliders">
    <div class="scard"><div class="srow"><span class="sname">🌸 Время фокуса</span><span class="sval" id="vF">25 мин</span></div><input type="range" id="rF" min="5" max="120" value="25" step="5" oninput="onSlide()"></div>
    <div class="scard"><div class="srow"><span class="sname">☕ Перерыв</span><span class="sval" id="vB">5 мин</span></div><input type="range" id="rB" min="1" max="30" value="5" step="1" oninput="onSlide()"></div>
    <div class="scard"><div class="srow"><span class="sname">🔄 Сессий подряд</span><span class="sval" id="vS">2</span></div><input type="range" id="rS" min="1" max="6" value="2" step="1" oninput="onSlide()"></div>
  </div>
  <button class="start-btn" onclick="startFocus()">🌱 ПРИСТУПАЮ</button>
</div>

<!-- FOCUS -->
<div class="screen" id="sFocus">
  <div class="sakura-scene" id="sakuraScene">
    <img src="frame0.PNG" id="f0" class="visible">
    <img src="frame1.PNG" id="f1">
    <img src="frame2.PNG" id="f2">
    <img src="frame3.PNG" id="f3">
    <img src="frame4.PNG" id="f4">
    <img src="frame5.PNG" id="f5">
  </div>
  <div class="sky-overlay" id="skyOverlay"></div>
  <canvas id="fxCanvas"></canvas>
  <div class="burn-overlay" id="burnOverlay"></div>
  <div class="petal-layer" id="petalLayer"></div>
  <canvas id="fireCanvas"></canvas>
  <div class="vignette"></div>
  <div class="focus-ui">
    <div class="f-top">
      <div class="sess-badge" id="sessBadge">Сессия 1/2</div>
      <div class="set-ico" onclick="openSettings()">⚙️</div>
    </div>
    <div class="f-mid"></div>
    <div class="f-bottom">
      <button class="quit-btn work" id="qBtn" onclick="onQuit()">🔥 СДАТЬСЯ</button>
      <div>
        <div class="t-phase work" id="tPhase">ФОКУС</div>
        <div class="t-num work" id="tNum">25:00</div>
        <div class="t-hint" id="tHint">Сосредоточься, Глеб 🌸</div>
      </div>
    </div>
  </div>
</div>

<!-- WIN -->
<div class="screen end-screen" id="sWin">
  <div class="end-icon">🌸</div>
  <div class="end-title win">САКУРА РАСЦВЕЛА</div>
  <div class="end-sub">Все сессии пройдены.<br>Дерево выросло полностью.</div>
  <div class="end-xp" id="winXp">+50 XP ⚡</div>
  <div class="end-img-wrap"><img src="frame5.PNG"></div>
  <button class="end-btn win" onclick="show('sSettings')">🌱 Новая сессия</button>
</div>

<!-- LOSE -->
<div class="screen end-screen" id="sLose">
  <div class="end-icon">🔥</div>
  <div class="end-title lose">ДЕРЕВО СГОРЕЛО</div>
  <div class="end-sub">Ты прервал фокус.<br>Попробуй снова.</div>
  <div class="end-img-wrap burned" id="loseImgWrap"><img id="loseImg" src="frame0.PNG"></div>
  <button class="end-btn lose" onclick="show('sSettings')">🌱 Попробовать снова</button>
</div>

<script>
// ═══════════════════════════════════════
//  PRELOAD
// ═══════════════════════════════════════
const FRAMES = ['frame0.PNG','frame1.PNG','frame2.PNG','frame3.PNG','frame4.PNG','frame5.PNG'];
FRAMES.forEach(src => { const i = new Image(); i.src = src; });

// ═══════════════════════════════════════
//  CROSSFADE FRAMES
// ═══════════════════════════════════════
function setProgress(p) {
  const fp = Math.max(0, Math.min(1, p)) * 5;
  const lo = Math.floor(fp), hi = Math.min(lo+1, 5);
  const blend = fp - lo;
  for (let i = 0; i <= 5; i++) {
    const el = document.getElementById('f'+i);
    if (!el) continue;
    let op = 0;
    if (i === lo) op = 1 - blend;
    else if (i === hi) op = blend;
    el.style.opacity = op;
  }
  updateSkyOverlay(p);
}

// sky colour overlay changes with progress
function updateSkyOverlay(p) {
  const overlay = document.getElementById('skyOverlay');
  if (p < 0.3) {
    overlay.style.background = `rgba(6,4,26,${0.18 * (1-p/0.3)})`;
  } else if (p < 0.65) {
    const t = (p-0.3)/0.35;
    overlay.style.background = `rgba(180,80,120,${0.06*t})`;
  } else {
    const t = Math.min((p-0.65)/0.35, 1);
    overlay.style.background = `rgba(255,160,80,${0.1*t})`;
  }
}

// ═══════════════════════════════════════
//  FX CANVAS — wind swirls + clouds + sun
// ═══════════════════════════════════════
const fxCanvas = document.getElementById('fxCanvas');
const fxCtx = fxCanvas.getContext('2d');
let fxTime = 0;
let fxRunning = false;
let fxAnimId = null;

// Wind particles
class WindParticle {
  constructor() { this.reset(true); }
  reset(initial) {
    this.x = initial ? Math.random() * fxCanvas.width : -80;
    this.y = fxCanvas.height * (0.1 + Math.random() * 0.75);
    this.vx = 1.2 + Math.random() * 2.8;
    this.vy = (Math.random() - 0.5) * 0.6;
    this.life = 0;
    this.maxLife = 80 + Math.random() * 120;
    this.width = 40 + Math.random() * 140;
    this.height = 1.5 + Math.random() * 3.5;
    this.curve = (Math.random() - 0.5) * 30; // vertical curve
    this.alpha = 0.04 + Math.random() * 0.14;
    this.swirl = Math.random() > 0.65; // some particles become swirls
    this.swirlR = 8 + Math.random() * 22;
    this.swirlPhase = Math.random() * Math.PI * 2;
  }
  update() {
    this.life++;
    this.x += this.vx;
    this.y += this.vy + Math.sin(this.life * 0.04) * 0.3;
    if (this.x > fxCanvas.width + 120 || this.life >= this.maxLife) this.reset(false);
  }
  draw(ctx, progress) {
    const t2 = this.life / this.maxLife;
    const a = t2 < 0.18 ? t2/0.18 : t2 > 0.78 ? 1-(t2-0.78)/0.22 : 1;
    const alpha = this.alpha * a;
    if (alpha < 0.01) return;

    if (this.swirl && this.x > 0) {
      // SWIRL — like the reference images
      ctx.save();
      ctx.translate(this.x + this.width * 0.7, this.y);
      const swirlProgress = Math.min(this.life / (this.maxLife * 0.5), 1);
      const turns = 1.5 + swirlProgress;
      ctx.beginPath();
      for (let angle = 0; angle < turns * Math.PI * 2; angle += 0.08) {
        const r = this.swirlR * (1 - angle / (turns * Math.PI * 2)) * swirlProgress;
        const sx = Math.cos(angle + this.swirlPhase + fxTime * 0.8) * r;
        const sy = Math.sin(angle + this.swirlPhase + fxTime * 0.8) * r * 0.45;
        if (angle === 0) ctx.moveTo(sx, sy);
        else ctx.lineTo(sx, sy);
      }
      ctx.strokeStyle = `rgba(220,225,240,${alpha * 1.2})`;
      ctx.lineWidth = 1.8;
      ctx.stroke();
      ctx.restore();
    }

    // STREAM — flowing line
    ctx.save();
    ctx.translate(this.x, this.y);
    const g = ctx.createLinearGradient(0, 0, this.width, this.curve);
    g.addColorStop(0, 'transparent');
    g.addColorStop(0.25, `rgba(220,225,245,${alpha})`);
    g.addColorStop(0.6, `rgba(235,235,255,${alpha * 0.9})`);
    g.addColorStop(1, 'transparent');
    ctx.strokeStyle = g;
    ctx.lineWidth = this.height;
    ctx.lineCap = 'round';
    ctx.beginPath();
    ctx.moveTo(0, 0);
    ctx.bezierCurveTo(
      this.width * 0.3, this.curve * 0.3,
      this.width * 0.65, this.curve * 0.7,
      this.width, this.curve
    );
    ctx.stroke();
    ctx.restore();
  }
}

// Clouds
class Cloud {
  constructor(offscreen) {
    this.x = offscreen ? -300 : Math.random() * (fxCanvas.width + 400) - 200;
    this.y = fxCanvas.height * (0.03 + Math.random() * 0.28);
    this.w = 120 + Math.random() * 200;
    this.h = 35 + Math.random() * 60;
    this.vx = 0.12 + Math.random() * 0.28;
    this.alpha = 0.12 + Math.random() * 0.22;
    this.puffs = [];
    const puffCount = 4 + Math.floor(Math.random() * 5);
    for (let i = 0; i < puffCount; i++) {
      this.puffs.push({
        x: (i / puffCount - 0.5) * this.w * 1.1,
        y: (Math.random() - 0.5) * this.h * 0.5,
        r: this.h * (0.4 + Math.random() * 0.5)
      });
    }
  }
  update() {
    this.x += this.vx;
    if (this.x > fxCanvas.width + 300) {
      this.x = -300;
      this.y = fxCanvas.height * (0.03 + Math.random() * 0.28);
    }
  }
  draw(ctx, progress) {
    ctx.save();
    ctx.translate(this.x + this.w / 2, this.y);
    // colour shifts from grey-blue to warm pink-white as progress increases
    const r = Math.round(180 + progress * 60);
    const g = Math.round(185 + progress * 50);
    const b = Math.round(210 - progress * 30);
    const baseAlpha = this.alpha * (0.6 + progress * 0.7);
    this.puffs.forEach(puff => {
      const cg = ctx.createRadialGradient(puff.x, puff.y, 0, puff.x, puff.y, puff.r);
      cg.addColorStop(0, `rgba(${r},${g},${b},${baseAlpha})`);
      cg.addColorStop(0.55, `rgba(${r-10},${g-10},${b-5},${baseAlpha * 0.55})`);
      cg.addColorStop(1, 'transparent');
      ctx.beginPath();
      ctx.arc(puff.x, puff.y, puff.r, 0, Math.PI * 2);
      ctx.fillStyle = cg;
      ctx.fill();
    });
    ctx.restore();
  }
}

// Sun
let sunY = 0;
function drawSun(ctx, W, H, progress) {
  if (progress < 0.3) return;
  const sp = Math.min((progress - 0.3) / 0.7, 1);
  // sun rises as progress increases
  const targetY = H * (0.18 - sp * 0.10);
  sunY += (targetY - sunY) * 0.008;
  const sunX = W * 0.52;

  // outer glow
  const og = ctx.createRadialGradient(sunX, sunY, 0, sunX, sunY, W * 0.55);
  og.addColorStop(0, `rgba(255,230,140,${0.22 * sp})`);
  og.addColorStop(0.2, `rgba(255,195,100,${0.14 * sp})`);
  og.addColorStop(0.5, `rgba(255,140,80,${0.06 * sp})`);
  og.addColorStop(1, 'transparent');
  ctx.fillStyle = og; ctx.fillRect(0, 0, W, H);

  // sun disc
  ctx.beginPath(); ctx.arc(sunX, sunY, 18 + sp * 6, 0, Math.PI * 2);
  const disc = ctx.createRadialGradient(sunX - 3, sunY - 3, 0, sunX, sunY, 24 + sp * 6);
  disc.addColorStop(0, `rgba(255,250,220,${0.85 * sp})`);
  disc.addColorStop(0.5, `rgba(255,215,120,${0.7 * sp})`);
  disc.addColorStop(1, `rgba(255,170,70,${0.3 * sp})`);
  ctx.fillStyle = disc; ctx.fill();

  // rays
  if (sp > 0.4) {
    const rayAlpha = (sp - 0.4) / 0.6 * 0.12;
    for (let i = 0; i < 12; i++) {
      const angle = (i / 12) * Math.PI * 2 + fxTime * 0.04;
      const r1 = 28 + sp * 8, r2 = 55 + sp * 30 + Math.sin(fxTime * 0.5 + i) * 8;
      ctx.strokeStyle = `rgba(255,220,120,${rayAlpha})`;
      ctx.lineWidth = 1.5;
      ctx.beginPath();
      ctx.moveTo(sunX + Math.cos(angle) * r1, sunY + Math.sin(angle) * r1);
      ctx.lineTo(sunX + Math.cos(angle) * r2, sunY + Math.sin(angle) * r2);
      ctx.stroke();
    }
  }
}

let windParticles = [], clouds = [];

function initFX() {
  windParticles = [];
  clouds = [];
  for (let i = 0; i < 22; i++) windParticles.push(new WindParticle());
  for (let i = 0; i < 6; i++) clouds.push(new Cloud(false));
  sunY = fxCanvas.height * 0.25;
}

function resizeFX() {
  fxCanvas.width = window.innerWidth;
  fxCanvas.height = window.innerHeight;
}
resizeFX();
window.addEventListener('resize', resizeFX);

function animFX() {
  if (!fxRunning) return;
  fxTime += 0.016;
  const W = fxCanvas.width, H = fxCanvas.height;
  fxCtx.clearRect(0, 0, W, H);
  drawSun(fxCtx, W, H, treeP);
  clouds.forEach(c => { c.update(); c.draw(fxCtx, treeP); });
  windParticles.forEach(p => { p.update(); p.draw(fxCtx, treeP); });
  fxAnimId = requestAnimationFrame(animFX);
}
function startFX() { fxRunning=true; resizeFX(); initFX(); animFX(); }
function stopFX() { fxRunning=false; cancelAnimationFrame(fxAnimId); fxCtx.clearRect(0,0,fxCanvas.width,fxCanvas.height); }

// ═══════════════════════════════════════
//  PETALS
// ═══════════════════════════════════════
let petalIv = null;
function startPetals() {
  if (petalIv) return;
  const layer = document.getElementById('petalLayer');
  petalIv = setInterval(() => {
    if (treeP < 0.32) return;
    const count = treeP > 0.72 ? 4 : treeP > 0.52 ? 3 : 2;
    for (let n = 0; n < count; n++) {
      const el = document.createElement('div'); el.className = 'pk';
      const pink = 140 + ~~(Math.random() * 90);
      const size = 8 + ~~(Math.random() * 10);
      el.innerHTML = `<svg width="${size}" height="${Math.round(size*0.7)}" viewBox="0 0 11 8"><ellipse cx="5.5" cy="4" rx="4.8" ry="3" fill="rgba(255,${pink},176,${.72+Math.random()*.28})" transform="rotate(${Math.random()*360} 5.5 4)"/></svg>`;
      el.style.left = Math.random() * 110 - 5 + '%';
      const d = 3.5 + Math.random() * 8;
      el.style.animationDuration = d + 's';
      el.style.animationDelay = Math.random() * 1.5 + 's';
      layer.appendChild(el);
      setTimeout(() => el.remove(), (d + 3) * 1000);
    }
  }, 260);
}
function stopPetals() { clearInterval(petalIv); petalIv=null; document.getElementById('petalLayer').innerHTML=''; }

// ═══════════════════════════════════════
//  FIRE CANVAS
// ═══════════════════════════════════════
const fireCanvas = document.getElementById('fireCanvas');
const firCtx = fireCanvas.getContext('2d');
let fireRunning=false, fireAnimId=null, fireParts=[];

class FP {
  constructor(){this.reset();}
  reset(){
    const cx=fireCanvas.width*.5,sp=fireCanvas.width*.38;
    this.x=cx+(Math.random()-.5)*sp*2;this.y=fireCanvas.height*(0.58+Math.random()*.28);
    this.vx=(Math.random()-.5)*1.8;this.vy=-(1.6+Math.random()*3.4);
    this.life=0;this.maxLife=55+~~(Math.random()*75);this.size=8+Math.random()*22;this.ember=Math.random()>.72;
  }
  update(){this.life++;this.x+=this.vx+Math.sin(this.life*.18)*.7;this.y+=this.vy;this.vy*=.987;this.vx*=.979;this.size*=.989;if(this.life>=this.maxLife||this.size<.4)this.reset();}
  draw(ctx){
    const t2=this.life/this.maxLife,a=t2<.15?t2/.15:t2>.72?1-(t2-.72)/.28:1;
    if(this.ember){const r=this.size*.3,g=ctx.createRadialGradient(this.x,this.y,0,this.x,this.y,r*2.5);g.addColorStop(0,`rgba(255,240,180,${a})`);g.addColorStop(.5,`rgba(255,140,0,${a*.6})`);g.addColorStop(1,'rgba(255,40,0,0)');ctx.beginPath();ctx.arc(this.x,this.y,r*2.5,0,Math.PI*2);ctx.fillStyle=g;ctx.fill();}
    else{const g=ctx.createRadialGradient(this.x,this.y,0,this.x,this.y+this.size*.3,this.size*1.1);g.addColorStop(0,`rgba(255,255,200,${a*.95})`);g.addColorStop(.3,`rgba(255,220,50,${a*.88})`);g.addColorStop(.6,`rgba(255,100,0,${a*.7})`);g.addColorStop(1,'rgba(100,0,0,0)');ctx.save();ctx.translate(this.x,this.y);ctx.scale(1,1.65+Math.sin(this.life*.12)*.18);ctx.beginPath();ctx.arc(0,0,this.size,0,Math.PI*2);ctx.fillStyle=g;ctx.fill();ctx.restore();}
  }
}

function resizeFire(){fireCanvas.width=window.innerWidth;fireCanvas.height=window.innerHeight;}
resizeFire();window.addEventListener('resize',resizeFire);

function startFire(){
  fireRunning=true;resizeFire();fireParts=[];
  for(let i=0;i<140;i++){const fp=new FP();fp.life=~~(Math.random()*fp.maxLife);fireParts.push(fp);}
  fireCanvas.classList.add('active');animFire();
}
function animFire(){
  if(!fireRunning)return;firCtx.clearRect(0,0,fireCanvas.width,fireCanvas.height);
  const cx=fireCanvas.width*.5,by=fireCanvas.height*.75;
  const bg=firCtx.createRadialGradient(cx,by,0,cx,by,fireCanvas.width*.45);
  bg.addColorStop(0,'rgba(255,110,0,.16)');bg.addColorStop(.5,'rgba(180,40,0,.07)');bg.addColorStop(1,'transparent');
  firCtx.fillStyle=bg;firCtx.fillRect(0,0,fireCanvas.width,fireCanvas.height);
  fireParts.forEach(p=>{p.update();p.draw(firCtx);});
  fireAnimId=requestAnimationFrame(animFire);
}
function stopFire(){fireRunning=false;cancelAnimationFrame(fireAnimId);firCtx.clearRect(0,0,fireCanvas.width,fireCanvas.height);fireCanvas.classList.remove('active');}

// ═══════════════════════════════════════
//  BACKGROUND TIMER (survives app switch)
// ═══════════════════════════════════════
const BG_KEY = 'focus_bg_state';

function saveBgState() {
  if (!isRunning) return;
  localStorage.setItem(BG_KEY, JSON.stringify({
    startTime: Date.now(),
    remaining,
    totalSec,
    isWork,
    curSess,
    totalSess: totalSess,
    focusMins,
    breakMins,
    treeP,
    active: true
  }));
}

function clearBgState() {
  localStorage.removeItem(BG_KEY);
}

function resumeFromBg() {
  const raw = localStorage.getItem(BG_KEY);
  if (!raw) return false;
  try {
    const s = JSON.parse(raw);
    if (!s.active) return false;
    const elapsed = Math.floor((Date.now() - s.startTime) / 1000);
    let rem = s.remaining - elapsed;
    let work = s.isWork;
    let sess = s.curSess;
    let tp = s.treeP;
    totalSess = s.totalSess;
    focusMins = s.focusMins;
    breakMins = s.breakMins;

    // fast-forward through phases
    while (rem <= 0) {
      if (work && sess >= totalSess) {
        // finished
        clearBgState();
        treeP = 1; setProgress(1);
        finishWin();
        return true;
      } else if (work) {
        rem += breakMins * 60;
        work = false;
      } else {
        sess++;
        rem += focusMins * 60;
        work = true;
      }
    }
    curSess = sess;
    isWork = work;
    remaining = rem;
    totalSec = (work ? focusMins : breakMins) * 60;
    if (work) {
      const done = (sess-1)*focusMins*60 + (focusMins*60 - rem);
      tp = Math.min(done / (totalSess*focusMins*60), 1);
    }
    treeP = tp;
    setProgress(treeP);
    return true;
  } catch(e) { return false; }
}

// save every 10 seconds
let bgSaveIv = null;
function startBgSave() { bgSaveIv = setInterval(saveBgState, 10000); }
function stopBgSave() { clearInterval(bgSaveIv); bgSaveIv = null; }

// page visibility
document.addEventListener('visibilitychange', () => {
  if (document.hidden) {
    saveBgState();
  } else if (isRunning) {
    // came back — sync timer
    const raw = localStorage.getItem(BG_KEY);
    if (raw) {
      try {
        const s = JSON.parse(raw);
        if (s.active) {
          const elapsed = Math.floor((Date.now() - s.startTime) / 1000);
          const newRem = s.remaining - elapsed;
          if (newRem > 0) {
            remaining = newRem;
            refreshUI();
          }
        }
      } catch(e) {}
    }
  }
});

// ═══════════════════════════════════════
//  STATE
// ═══════════════════════════════════════
let focusMins=25, breakMins=5, totalSess=2;
let curSess=1, isWork=true, remaining=0, totalSec=0;
let treeP=0, iv=null, armed=false, isRunning=false;

function onSlide(){
  focusMins=+document.getElementById('rF').value;
  breakMins=+document.getElementById('rB').value;
  totalSess=+document.getElementById('rS').value;
  document.getElementById('vF').textContent=focusMins+' мин';
  document.getElementById('vB').textContent=breakMins+' мин';
  document.getElementById('vS').textContent=totalSess;
}

function startFocus(){
  // check if resuming
  if (resumeFromBg()) {
    show('sFocus');
    startFX(); startPetals();
    refreshUI();
    isRunning = true;
    iv = setInterval(tick, 1000);
    startBgSave();
    return;
  }
  curSess=1;isWork=true;treeP=0;armed=false;isRunning=true;
  setProgress(0);
  document.getElementById('burnOverlay').classList.remove('active');
  stopFire();
  show('sFocus');
  startFX();
  startPetals();
  beginPhase();
  startBgSave();
}

function beginPhase(){
  clearInterval(iv);
  totalSec=(isWork?focusMins:breakMins)*60;
  remaining=totalSec;
  refreshUI();
  iv=setInterval(tick,1000);
}

const HINTS=['Сосредоточься, Глеб 🌸','Ты в потоке 🌊','Сакура растёт...','Не отвлекайся 💪','Ещё немного!'];

function tick(){
  remaining=Math.max(0,remaining-1);
  if(isWork){
    const done=(curSess-1)*focusMins*60+(focusMins*60-remaining);
    treeP=Math.min(done/(totalSess*focusMins*60),1);
    setProgress(treeP);
  }
  refreshUI();
  if(remaining<=0){
    clearInterval(iv);
    if(isWork&&curSess>=totalSess)setTimeout(finishWin,500);
    else if(isWork){isWork=false;beginPhase();}
    else{curSess++;isWork=true;beginPhase();}
  }
}

function refreshUI(){
  const m=~~(remaining/60),s=remaining%60;
  const ts=`${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}`;
  document.getElementById('tNum').textContent=ts;
  document.getElementById('tNum').className='t-num '+(isWork?'work':'rest');
  document.getElementById('tPhase').textContent=isWork?'ФОКУС':'ПЕРЕРЫВ';
  document.getElementById('tPhase').className='t-phase '+(isWork?'work':'rest');
  document.getElementById('tHint').textContent=isWork?HINTS[Math.min(~~((1-remaining/totalSec)*HINTS.length),HINTS.length-1)]:'Отдохни, скоро следующая сессия ☕';
  document.getElementById('sessBadge').textContent=`Сессия ${curSess}/${totalSess}`;
  const btn=document.getElementById('qBtn');
  if(isWork){btn.className='quit-btn work';if(!armed){btn.textContent='🔥 СДАТЬСЯ';btn.style.fontSize='';}btn.disabled=false;}
  else{btn.className='quit-btn rest';btn.textContent=`☕ ПЕРЕРЫВ  ${ts}`;btn.disabled=true;armed=false;}
}

function onQuit(){
  if(!isWork)return;
  if(!armed){
    armed=true;const btn=document.getElementById('qBtn');
    btn.textContent='❗ Ещё раз — дерево сгорит';btn.style.fontSize='11px';
    setTimeout(()=>{if(armed){armed=false;btn.textContent='🔥 СДАТЬСЯ';btn.style.fontSize='';}},2800);
    return;
  }
  armed=false;isRunning=false;
  clearInterval(iv);stopPetals();stopFX();stopBgSave();clearBgState();
  document.getElementById('burnOverlay').classList.add('active');
  startFire();
  const idx=Math.round(treeP*5);
  document.getElementById('loseImg').src='frame'+idx+'.PNG';
  setTimeout(()=>{stopFire();show('sLose');},3500);
}

function finishWin(){
  isRunning=false;
  stopPetals();stopFX();stopBgSave();clearBgState();
  const xp=totalSess*focusMins*2;
  document.getElementById('winXp').textContent=`+${xp} XP ⚡`;
  try{const c=JSON.parse(localStorage.getItem('xp_total')||'0');localStorage.setItem('xp_total',JSON.stringify(c+xp));}catch(e){}
  show('sWin');
}

function openSettings(){
  clearInterval(iv);stopPetals();stopFX();stopFire();stopBgSave();
  isRunning=false;armed=false;clearBgState();
  show('sSettings');
}

function show(id){
  document.querySelectorAll('.screen').forEach(s=>s.classList.remove('active'));
  document.getElementById(id).classList.add('active');
}
function goHome(){window.location.href='index.html';}

onSlide();
// animate settings preview
setInterval(()=>{
  document.getElementById('prev0').style.opacity='0';
  document.getElementById('prev5').style.opacity='1';
  setTimeout(()=>{
    document.getElementById('prev0').style.opacity='1';
    document.getElementById('prev5').style.opacity='0';
  },2500);
},5000);
</script>
