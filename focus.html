<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Фокус</title>
<link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@400;600;700;900&family=Golos+Text:wght@400;500;600&display=swap" rel="stylesheet">
<style>
* { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
html,body { width:100%; height:100%; overflow:hidden; background:#06041a; }
body { font-family:'Golos Text',sans-serif; color:#f0e8ff; }

.screen { display:none; width:100%; height:100vh; flex-direction:column; overflow:hidden; }
.screen.active { display:flex; }

/* SETTINGS */
#sSettings {
  background:linear-gradient(180deg,#0d0a28,#130e38 60%,#0d0a28);
  overflow-y:auto; align-items:center; padding:52px 20px 32px; gap:14px;
}
.set-back { align-self:flex-start; color:#6050a0; font-size:13px; cursor:pointer; text-decoration:underline; }
.set-label { font-family:'Unbounded',sans-serif; font-size:11px; font-weight:600; letter-spacing:.2em; color:#6050a0; text-transform:uppercase; }
.set-title { font-family:'Unbounded',sans-serif; font-size:22px; font-weight:700; text-align:center; background:linear-gradient(135deg,#f0e8ff,#ffb3cc); -webkit-background-clip:text; -webkit-text-fill-color:transparent; }
.preview-canvas { border-radius:16px; overflow:hidden; width:100%; max-width:320px; }
.preview-canvas canvas { display:block; width:100%; height:auto; }
.sliders { width:100%; display:flex; flex-direction:column; gap:10px; }
.scard { background:rgba(255,255,255,0.06); border:1px solid rgba(255,255,255,0.1); border-radius:16px; padding:16px 18px; }
.srow { display:flex; justify-content:space-between; align-items:center; margin-bottom:12px; }
.sname { font-size:14px; font-weight:500; }
.sval { font-family:'Unbounded',sans-serif; font-size:16px; font-weight:700; color:#ff6b9d; }
input[type=range] { width:100%; -webkit-appearance:none; height:5px; border-radius:5px; background:rgba(255,255,255,0.12); outline:none; cursor:pointer; }
input[type=range]::-webkit-slider-thumb { -webkit-appearance:none; width:24px; height:24px; border-radius:50%; background:linear-gradient(135deg,#ff6b9d,#c44dff); box-shadow:0 0 12px rgba(255,107,157,.5); cursor:pointer; }
.start-btn { width:100%; background:linear-gradient(135deg,#ff6b9d,#c44dff); border:none; border-radius:18px; padding:18px; color:#fff; font-family:'Unbounded',sans-serif; font-size:14px; font-weight:700; letter-spacing:.08em; cursor:pointer; box-shadow:0 8px 30px rgba(255,107,157,.4); }
.start-btn:active { opacity:.88; transform:scale(.97); }

/* FOCUS */
#sFocus { position:relative; }
#sceneCanvas { position:absolute; inset:0; width:100%; height:100%; display:block; }

/* petals layer */
.petal-layer { position:absolute; inset:0; pointer-events:none; z-index:5; overflow:hidden; }
.pk { position:absolute; top:-16px; opacity:0; animation:pfall linear infinite; }
@keyframes pfall {
  0%{opacity:0;transform:translateY(0) rotate(0deg) translateX(0)}
  8%{opacity:.85} 90%{opacity:.65}
  100%{opacity:0;transform:translateY(108vh) rotate(480deg) translateX(90px)}
}

/* UI overlay */
.focus-ui { position:absolute; inset:0; z-index:10; display:flex; flex-direction:column; justify-content:space-between; padding:52px 20px 36px; pointer-events:none; }
.focus-ui > * { pointer-events:all; }
.f-top { display:flex; justify-content:space-between; align-items:center; }
.sess-badge { font-family:'Unbounded',sans-serif; font-size:11px; font-weight:600; letter-spacing:.1em; color:rgba(240,232,255,.7); background:rgba(6,4,26,.55); border:1px solid rgba(255,255,255,.15); border-radius:20px; padding:6px 14px; backdrop-filter:blur(8px); }
.set-ico { width:36px; height:36px; border-radius:12px; background:rgba(6,4,26,.55); border:1px solid rgba(255,255,255,.15); display:flex; align-items:center; justify-content:center; font-size:16px; cursor:pointer; backdrop-filter:blur(8px); }
.f-mid { flex:1; pointer-events:none; }
.f-bottom { display:flex; flex-direction:column; align-items:center; gap:10px; }
.quit-btn { width:100%; border:none; border-radius:16px; padding:15px; font-family:'Unbounded',sans-serif; font-size:13px; font-weight:700; letter-spacing:.06em; cursor:pointer; transition:all .35s; backdrop-filter:blur(14px); }
.quit-btn.work { background:rgba(140,20,20,.35); border:1px solid rgba(255,80,80,.5); color:#ff9090; }
.quit-btn.rest { background:rgba(100,50,200,.35); border:1px solid rgba(160,110,255,.5); color:#c0a8ff; }
.quit-btn:active { transform:scale(.96); }
.t-phase { font-family:'Unbounded',sans-serif; font-size:10px; font-weight:600; letter-spacing:.2em; text-transform:uppercase; text-align:center; }
.t-phase.work { color:rgba(255,200,215,.65); }
.t-phase.rest { color:rgba(180,215,255,.65); }
.t-num { font-family:'Unbounded',sans-serif; font-size:40px; font-weight:900; line-height:1; letter-spacing:-.02em; text-align:center; text-shadow:0 0 30px rgba(255,150,190,.5),0 2px 14px rgba(0,0,0,.9); }
.t-num.work { color:rgba(255,242,248,.9); }
.t-num.rest { color:rgba(200,228,255,.9); }
.t-hint { font-size:11px; color:rgba(200,185,240,.4); margin-top:2px; text-align:center; }

/* END */
.end-screen { background:linear-gradient(180deg,#0d0a28,#130e38,#0d0a28); align-items:center; justify-content:center; text-align:center; padding:60px 24px 40px; overflow-y:auto; gap:0; }
.end-icon { font-size:58px; margin-bottom:14px; animation:pop .5s cubic-bezier(.34,1.56,.64,1); }
@keyframes pop { from{transform:scale(0)} to{transform:scale(1)} }
.end-title { font-family:'Unbounded',sans-serif; font-size:22px; font-weight:900; margin-bottom:8px; }
.end-title.win { background:linear-gradient(135deg,#ffb3cc,#c44dff); -webkit-background-clip:text; -webkit-text-fill-color:transparent; }
.end-title.lose { color:#ff7070; }
.end-sub { font-size:14px; color:#6050a0; line-height:1.6; margin-bottom:10px; }
.end-xp { font-family:'Unbounded',sans-serif; font-size:30px; font-weight:900; color:#fde047; margin-bottom:16px; }
.end-canvas-wrap { width:min(280px,85vw); border-radius:16px; overflow:hidden; margin:0 auto 22px; }
.end-canvas-wrap canvas { display:block; width:100%; height:auto; }
.end-btn { width:100%; border:none; border-radius:16px; padding:16px; color:#fff; font-family:'Unbounded',sans-serif; font-size:13px; font-weight:700; cursor:pointer; }
.end-btn.win { background:linear-gradient(135deg,#ff6b9d,#c44dff); box-shadow:0 8px 28px rgba(255,107,157,.4); }
.end-btn.lose { background:linear-gradient(135deg,#ff6b6b,#cc2200); }
</style>
</head>
<body>

<!-- SETTINGS -->
<div class="screen active" id="sSettings">
  <div class="set-back" onclick="goHome()">← К задачам</div>
  <div class="set-label">режим фокуса</div>
  <div class="set-title">Посади сакуру 🌸</div>
  <div class="preview-canvas">
    <canvas id="previewCanvas" width="320" height="260"></canvas>
  </div>
  <div class="sliders">
    <div class="scard"><div class="srow"><span class="sname">🌸 Время фокуса</span><span class="sval" id="vF">25 мин</span></div><input type="range" id="rF" min="5" max="120" value="25" step="5" oninput="onSlide()"></div>
    <div class="scard"><div class="srow"><span class="sname">☕ Перерыв</span><span class="sval" id="vB">5 мин</span></div><input type="range" id="rB" min="1" max="30" value="5" step="1" oninput="onSlide()"></div>
    <div class="scard"><div class="srow"><span class="sname">🔄 Сессий подряд</span><span class="sval" id="vS">2</span></div><input type="range" id="rS" min="1" max="6" value="2" step="1" oninput="onSlide()"></div>
  </div>
  <button class="start-btn" onclick="startFocus()">🌱 ПРИСТУПАЮ</button>
</div>

<!-- FOCUS -->
<div class="screen" id="sFocus">
  <canvas id="sceneCanvas"></canvas>
  <div class="petal-layer" id="petalLayer"></div>
  <div class="focus-ui">
    <div class="f-top">
      <div class="sess-badge" id="sessBadge">Сессия 1 / 2</div>
      <div class="set-ico" onclick="openSettings()">⚙️</div>
    </div>
    <div class="f-mid"></div>
    <div class="f-bottom">
      <button class="quit-btn work" id="qBtn" onclick="onQuit()">🔥 СДАТЬСЯ</button>
      <div>
        <div class="t-phase work" id="tPhase">ФОКУС</div>
        <div class="t-num work" id="tNum">25:00</div>
        <div class="t-hint" id="tHint">Сосредоточься, Глеб</div>
      </div>
    </div>
  </div>
</div>

<!-- WIN -->
<div class="screen end-screen" id="sWin">
  <div class="end-icon">🌸</div>
  <div class="end-title win">САКУРА РАСЦВЕЛА</div>
  <div class="end-sub">Ты продержался все сессии.<br>Дерево выросло полностью.</div>
  <div class="end-xp" id="winXp">+50 XP ⚡</div>
  <div class="end-canvas-wrap"><canvas id="winCanvas" width="280" height="220"></canvas></div>
  <button class="end-btn win" onclick="show('sSettings')">🌱 Новая сессия</button>
</div>

<!-- LOSE -->
<div class="screen end-screen" id="sLose">
  <div class="end-icon">🔥</div>
  <div class="end-title lose">ДЕРЕВО СГОРЕЛО</div>
  <div class="end-sub">Ты прервал фокус.<br>Попробуй снова.</div>
  <div class="end-canvas-wrap"><canvas id="loseCanvas" width="280" height="220"></canvas></div>
  <button class="end-btn lose" onclick="show('sSettings')">🌱 Попробовать снова</button>
</div>

<script>
// ═══════════════════════════════════════════════════
//  ALTO'S ODYSSEY STYLE SCENE RENDERER
// ═══════════════════════════════════════════════════

let windTime = 0;
let windStrength = 0;
let windTarget = 0.3;
let windGustTimer = 0;

function updateWind() {
  windTime += 0.016;
  windGustTimer -= 0.016;
  if (windGustTimer <= 0) {
    windTarget = (Math.random() - 0.3) * 0.8;
    windGustTimer = 2 + Math.random() * 4;
  }
  windStrength += (windTarget - windStrength) * 0.02;
}

// ── SCENE DRAWING ──
function drawScene(canvas, progress, burned, time) {
  const ctx = canvas.getContext('2d');
  const W = canvas.width, H = canvas.height;
  ctx.clearRect(0, 0, W, H);

  const p = Math.max(0, Math.min(1, progress));
  const t = time || 0;

  // ── SKY ──
  drawSky(ctx, W, H, p, burned, t);

  // ── FAR MOUNTAINS ──
  drawFarMountains(ctx, W, H, p, burned);

  // ── MID MOUNTAINS ──
  drawMidMountains(ctx, W, H, p, burned);

  // ── MIST ──
  if (!burned) drawMist(ctx, W, H, p);

  // ── MAIN CLIFF (background) ──
  drawCliff(ctx, W, H, burned);

  // ── TREE ──
  if (p > 0.02) drawTree(ctx, W, H, p, burned, t);

  // ── FOREGROUND ROCKS ──
  drawForeground(ctx, W, H, burned);

  // ── FIREFLIES ──
  if (!burned && p > 0.5) drawFireflies(ctx, W, H, p, t);
}

function drawSky(ctx, W, H, p, burned, t) {
  let sky;
  if (burned) {
    sky = ctx.createLinearGradient(0,0,0,H*0.7);
    sky.addColorStop(0,'#0f0308');
    sky.addColorStop(0.4,'#1a0508');
    sky.addColorStop(1,'#0a0205');
  } else {
    sky = ctx.createLinearGradient(0,0,0,H*0.7);
    if (p < 0.4) {
      // night → dawn
      const dp = p/0.4;
      sky.addColorStop(0, lerpC('#060418','#1a1040', dp));
      sky.addColorStop(0.3, lerpC('#0a0828','#2a1855', dp));
      sky.addColorStop(0.7, lerpC('#0d0a20','#3a1e60', dp));
      sky.addColorStop(1, lerpC('#080518','#2a1040', dp));
    } else {
      // dawn → golden hour
      const dp = Math.min((p-0.4)/0.6,1);
      sky.addColorStop(0, lerpC('#1a1040','#0d1a3a', dp));
      sky.addColorStop(0.25, lerpC('#2a1855','#1a2a5a', dp));
      sky.addColorStop(0.55, lerpC('#3a1e60','#2a3878', dp));
      sky.addColorStop(0.8, lerpC('#2a1040','#1a2555', dp));
      sky.addColorStop(1, lerpC('#1a0828','#0e1830', dp));
    }
  }
  ctx.fillStyle = sky;
  ctx.fillRect(0, 0, W, H);

  // stars (fade with progress)
  if (!burned && p < 0.6) {
    const sa = (1 - p/0.6) * 0.8;
    [[.1,.06],[.82,.04],[.22,.15],[.68,.09],[.9,.2],[.07,.28],[.93,.32],[.42,.05],[.57,.13],[.35,.22],[.74,.25],[.15,.38],[.88,.42]].forEach(([sx,sy]) => {
      const twinkle = 0.6 + 0.4 * Math.sin(t*2.3 + sx*10);
      ctx.beginPath(); ctx.arc(sx*W, sy*H*0.6, 1.3, 0, Math.PI*2);
      ctx.fillStyle = `rgba(255,255,255,${sa*twinkle})`; ctx.fill();
    });
  }

  // sun / moon
  if (!burned) {
    if (p < 0.3) {
      // moon
      const moonA = (1 - p/0.3) * 0.9;
      ctx.beginPath(); ctx.arc(W*0.78, H*0.12, 18, 0, Math.PI*2);
      const mg = ctx.createRadialGradient(W*0.78, H*0.12, 0, W*0.78, H*0.12, 30);
      mg.addColorStop(0,`rgba(240,235,210,${moonA})`);
      mg.addColorStop(0.6,`rgba(220,215,190,${moonA*0.7})`);
      mg.addColorStop(1,'transparent');
      ctx.fillStyle = mg; ctx.fill();
    }
    if (p > 0.45) {
      // sun rising
      const sunP = Math.min((p-0.45)/0.55, 1);
      const sunY = H * (0.28 - sunP * 0.18);
      const sunR = ctx.createRadialGradient(W*0.5, sunY, 0, W*0.5, sunY, W*0.55);
      sunR.addColorStop(0, `rgba(255,220,130,${sunP*0.55})`);
      sunR.addColorStop(0.25, `rgba(255,175,80,${sunP*0.28})`);
      sunR.addColorStop(0.6, `rgba(255,130,60,${sunP*0.1})`);
      sunR.addColorStop(1, 'transparent');
      ctx.fillStyle = sunR; ctx.fillRect(0,0,W,H);
    }
  }

  // clouds
  if (!burned) {
    const cloudA = p > 0.5 ? Math.min((p-0.5)/0.3,1)*0.2 : p/0.5*0.12;
    const clouds = [{x:.15,y:.18,rx:90,ry:22},{x:.7,y:.13,rx:75,ry:18},{x:.45,y:.08,rx:60,ry:15},{x:.88,y:.25,rx:55,ry:14},{x:.05,y:.3,rx:50,ry:12}];
    clouds.forEach(c => {
      ctx.save();
      const drift = Math.sin(t*0.3 + c.x*5)*8;
      ctx.translate(c.x*W + drift, c.y*H);
      const cg = ctx.createRadialGradient(0,0,0,0,0,c.rx);
      cg.addColorStop(0,`rgba(255,255,255,${cloudA})`); cg.addColorStop(1,'transparent');
      ctx.fillStyle = cg; ctx.scale(1,c.ry/c.rx);
      ctx.beginPath(); ctx.arc(0,0,c.rx,0,Math.PI*2); ctx.fill();
      ctx.restore();
    });
  }
}

function drawFarMountains(ctx, W, H, p, burned) {
  const baseY = H * 0.55;
  const pts = [
    [-0.05,0],[0.05,0.38],[0.15,0.22],[0.28,0.42],[0.38,0.18],[0.5,0.45],[0.6,0.25],[0.72,0.48],[0.85,0.2],[0.95,0.42],[1.05,0.35],[1.1,0]
  ];
  ctx.beginPath();
  ctx.moveTo(0, H);
  ctx.lineTo(0, baseY - H*0.38);
  pts.forEach(([x,y]) => ctx.lineTo(x*W, baseY - y*H*0.38));
  ctx.lineTo(W, H); ctx.closePath();

  const mCol = burned ? ['#120608','#0d0405'] : ['#1a1840','#120e2a'];
  const mg = ctx.createLinearGradient(0, baseY-H*0.38, 0, baseY);
  mg.addColorStop(0, mCol[0]); mg.addColorStop(1, mCol[1]);
  ctx.fillStyle = mg; ctx.fill();

  // snow caps
  if (!burned && p > 0.3) {
    ctx.globalAlpha = Math.min((p-0.3)/0.3, 1) * 0.18;
    ctx.fillStyle = '#e8e8ff';
    ctx.beginPath();
    ctx.moveTo(W*0.38, baseY - H*0.18);
    ctx.lineTo(W*0.34, baseY - H*0.38*0.18);
    ctx.lineTo(W*0.42, baseY - H*0.38*0.18);
    ctx.closePath(); ctx.fill();
    ctx.beginPath();
    ctx.moveTo(W*0.6, baseY - H*0.25);
    ctx.lineTo(W*0.56, baseY - H*0.38*0.25);
    ctx.lineTo(W*0.64, baseY - H*0.38*0.25);
    ctx.closePath(); ctx.fill();
    ctx.globalAlpha = 1;
  }
}

function drawMidMountains(ctx, W, H, p, burned) {
  const baseY = H * 0.62;
  ctx.beginPath();
  ctx.moveTo(-10, H);
  ctx.lineTo(-10, baseY - H*0.18);
  ctx.quadraticCurveTo(W*0.08, baseY-H*0.28, W*0.18, baseY-H*0.15);
  ctx.quadraticCurveTo(W*0.28, baseY-H*0.32, W*0.42, baseY-H*0.12);
  ctx.quadraticCurveTo(W*0.55, baseY-H*0.28, W*0.65, baseY-H*0.1);
  ctx.quadraticCurveTo(W*0.78, baseY-H*0.22, W*0.88, baseY-H*0.08);
  ctx.quadraticCurveTo(W*0.96, baseY-H*0.15, W+10, baseY-H*0.05);
  ctx.lineTo(W+10, H); ctx.closePath();

  const mc = burned ? ['#0e0405','#080204'] : ['#221848','#180e30'];
  const g = ctx.createLinearGradient(0,baseY-H*0.3,0,baseY);
  g.addColorStop(0,mc[0]); g.addColorStop(1,mc[1]);
  ctx.fillStyle=g; ctx.fill();

  // trees on mid mountains (silhouette)
  if (!burned && p > 0.2) {
    const ta = Math.min((p-0.2)/0.2,1)*0.35;
    ctx.globalAlpha = ta;
    ctx.fillStyle = '#140e28';
    [[W*0.05,baseY-H*0.02],[W*0.1,baseY-H*0.03],[W*0.14,baseY-H*0.01],[W*0.75,baseY-H*0.02],[W*0.8,baseY-H*0.04],[W*0.86,baseY-H*0.01]].forEach(([tx,ty]) => {
      ctx.beginPath();
      ctx.moveTo(tx, ty); ctx.lineTo(tx-5, ty+12); ctx.lineTo(tx+5, ty+12);
      ctx.closePath(); ctx.fill();
      ctx.beginPath();
      ctx.moveTo(tx, ty-8); ctx.lineTo(tx-4, ty+4); ctx.lineTo(tx+4, ty+4);
      ctx.closePath(); ctx.fill();
    });
    ctx.globalAlpha = 1;
  }
}

function drawMist(ctx, W, H, p) {
  if (p < 0.1) return;
  const ma = Math.min(p/0.3,1) * 0.18;
  const mist = ctx.createLinearGradient(0, H*0.5, 0, H*0.72);
  mist.addColorStop(0,'transparent');
  mist.addColorStop(0.5,`rgba(180,170,220,${ma})`);
  mist.addColorStop(1,'transparent');
  ctx.fillStyle=mist; ctx.fillRect(0,H*0.5,W,H*0.22);
}

function drawCliff(ctx, W, H, burned) {
  const cx = W*0.5, cy = H*0.72;
  const cw = W*0.42, ch = H*0.28;

  ctx.save();
  ctx.shadowColor='rgba(0,0,0,0.7)'; ctx.shadowBlur=20; ctx.shadowOffsetX=6;

  // main cliff body
  ctx.beginPath();
  ctx.moveTo(cx-cw*0.7, H+20);
  ctx.lineTo(cx-cw*0.62, cy+ch*0.12);
  ctx.quadraticCurveTo(cx-cw*0.48, cy, cx-cw*0.1, cy-ch*0.04);
  ctx.quadraticCurveTo(cx, cy-ch*0.06, cx+cw*0.1, cy-ch*0.04);
  ctx.quadraticCurveTo(cx+cw*0.48, cy, cx+cw*0.62, cy+ch*0.12);
  ctx.lineTo(cx+cw*0.7, H+20); ctx.closePath();

  const cg = ctx.createLinearGradient(cx-cw,cy-ch*0.06,cx+cw,cy+ch);
  if (burned) {
    cg.addColorStop(0,'#150802'); cg.addColorStop(0.4,'#0e0502'); cg.addColorStop(1,'#060200');
  } else {
    cg.addColorStop(0,'#2e2545'); cg.addColorStop(0.3,'#241e38'); cg.addColorStop(0.6,'#1c1630'); cg.addColorStop(1,'#0e0c1e');
  }
  ctx.fillStyle=cg; ctx.fill();
  ctx.restore();

  // cliff top details
  if (!burned) {
    // moss
    const moss = ctx.createRadialGradient(cx,cy,0,cx,cy,cw*0.42);
    moss.addColorStop(0,'rgba(45,105,38,0.6)');
    moss.addColorStop(0.6,'rgba(30,80,25,0.3)');
    moss.addColorStop(1,'transparent');
    ctx.fillStyle=moss;
    ctx.beginPath(); ctx.ellipse(cx,cy,cw*0.42,ch*0.06,0,0,Math.PI*2); ctx.fill();

    // small stones
    ctx.fillStyle='rgba(180,160,220,0.15)';
    [[cx-cw*0.25,cy+2],[cx+cw*0.2,cy+1],[cx-cw*0.08,cy-1]].forEach(([x,y])=>{
      ctx.beginPath(); ctx.ellipse(x,y,8,4,0,0,Math.PI*2); ctx.fill();
    });
  }

  // cliff cracks
  ctx.strokeStyle=burned?'rgba(40,12,2,0.5)':'rgba(80,65,100,0.35)';
  ctx.lineWidth=1.2;
  [[cx-cw*0.3,cy+ch*0.05,cx-cw*0.18,cy+ch*0.18],[cx+cw*0.12,cy+ch*0.04,cx+cw*0.24,cy+ch*0.16]].forEach(([x1,y1,x2,y2])=>{
    ctx.beginPath(); ctx.moveTo(x1,y1); ctx.lineTo(x2,y2); ctx.stroke();
  });

  // roots
  if (!burned) {
    const roots = [
      {cx1:-.15,cy1:.04,ex:-.3,ey:.18,w:4.5},
      {cx1:-.1,cy1:.065,ex:-.25,ey:.26,w:3.2},
      {cx1:.15,cy1:.04,ex:.3,ey:.18,w:4.5},
      {cx1:.1,cy1:.065,ex:.25,ey:.26,w:3.2},
      {cx1:-.04,cy1:.08,ex:-.12,ey:.3,w:2.2},
      {cx1:.04,cy1:.08,ex:.12,ey:.3,w:2.2},
    ];
    roots.forEach(r=>{
      ctx.beginPath(); ctx.moveTo(cx,cy);
      ctx.quadraticCurveTo(cx+r.cx1*W,cy+r.cy1*H,cx+r.ex*W,cy+r.ey*H);
      ctx.strokeStyle='rgba(62,32,14,0.88)'; ctx.lineWidth=r.w; ctx.lineCap='round'; ctx.stroke();
      ctx.beginPath(); ctx.moveTo(cx,cy);
      ctx.quadraticCurveTo(cx+r.cx1*W*.88,cy+r.cy1*H*.8,cx+r.ex*W*.62,cy+r.ey*H*.62);
      ctx.strokeStyle='rgba(130,78,38,0.22)'; ctx.lineWidth=r.w*.32; ctx.stroke();
    });
  }
}

function drawForeground(ctx, W, H, burned) {
  // foreground rocks (bottom corners)
  const rocksL = [[W*-0.02,H,W*0.06,H,W*0.04,H*0.88,W*-0.01,H*0.9]];
  const rocksR = [[W*0.94,H,W*1.02,H,W*1.02,H*0.9,W*0.96,H*0.87]];
  const rockCol = burned ? 'rgba(10,4,2,0.95)' : 'rgba(14,10,22,0.9)';

  ctx.fillStyle = rockCol;
  [...rocksL,...rocksR].forEach(pts => {
    ctx.beginPath();
    ctx.moveTo(pts[0],pts[1]);
    for(let i=2;i<pts.length;i+=2) ctx.lineTo(pts[i],pts[i+1]);
    ctx.closePath(); ctx.fill();
  });

  // grass tufts on foreground
  if (!burned) {
    ctx.strokeStyle='rgba(45,90,35,0.5)'; ctx.lineWidth=1.5;
    [[W*0.04,H*0.88],[W*0.06,H*0.9],[W*0.96,H*0.87],[W*0.98,H*0.9]].forEach(([gx,gy])=>{
      for(let i=-2;i<=2;i++){
        ctx.beginPath(); ctx.moveTo(gx+i*3,gy);
        ctx.quadraticCurveTo(gx+i*3+windStrength*8,gy-10,gx+i*4+windStrength*12,gy-16);
        ctx.stroke();
      }
    });
  }
}

// ── TREE ──
function drawTree(ctx, W, H, p, burned, t) {
  const cx = W*0.5;
  const cliffY = H*0.72;
  const wind = burned ? 0 : windStrength;

  // grow phases
  const trunkP = Math.min(p*1.8,1);
  const branchP = Math.min(Math.max(p-0.25,0)/0.4,1);
  const blossomP = Math.min(Math.max(p-0.55,0)/0.45,1);

  const trunkH = H*0.44*trunkP;
  const trunkTop = cliffY - trunkH;
  const tw = W*0.065;

  // trunk sway from wind
  const sway = wind * 8 * (trunkP > 0 ? 1 : 0);
  const swayX = Math.sin(t*1.5) * sway;

  // ── TRUNK ──
  if (trunkH > 3) {
    ctx.save();
    ctx.shadowColor='rgba(0,0,0,0.6)'; ctx.shadowBlur=12; ctx.shadowOffsetX=4;

    // left edge
    ctx.beginPath();
    ctx.moveTo(cx-tw, cliffY);
    ctx.bezierCurveTo(
      cx-tw*0.8+swayX*0.2, cliffY-trunkH*0.3,
      cx-tw*0.55+swayX*0.6, cliffY-trunkH*0.65,
      cx-tw*0.35+swayX, trunkTop
    );
    ctx.lineTo(cx+tw*0.35+swayX, trunkTop);
    ctx.bezierCurveTo(
      cx+tw*0.55+swayX*0.6, cliffY-trunkH*0.65,
      cx+tw*0.8+swayX*0.2, cliffY-trunkH*0.3,
      cx+tw, cliffY
    );
    ctx.closePath();

    const tg = ctx.createLinearGradient(cx-tw,0,cx+tw,0);
    if (burned) {
      tg.addColorStop(0,'#100602'); tg.addColorStop(0.35,'#1e0c06'); tg.addColorStop(0.65,'#180a05'); tg.addColorStop(1,'#0c0402');
    } else {
      tg.addColorStop(0,'#3a1c08'); tg.addColorStop(0.2,'#7a4828'); tg.addColorStop(0.45,'#a06844'); tg.addColorStop(0.72,'#7a4828'); tg.addColorStop(1,'#3a1c08');
    }
    ctx.fillStyle=tg; ctx.fill();

    // bark texture
    if (!burned && trunkH > 30) {
      ctx.strokeStyle='rgba(28,10,3,0.42)'; ctx.lineWidth=1.5;
      for(let i=1;i<=5;i++){
        const by = cliffY - trunkH*(i*0.16);
        const bx = cx + swayX*(i*0.2);
        const bw = tw*(1-i*0.055);
        ctx.beginPath(); ctx.moveTo(bx-bw+2,by+2); ctx.quadraticCurveTo(bx,by+5,bx+bw-2,by-1); ctx.stroke();
      }
      // highlight stripe
      ctx.strokeStyle='rgba(175,108,55,0.2)'; ctx.lineWidth=tw*0.28;
      ctx.beginPath();
      ctx.moveTo(cx-tw*0.05, cliffY-trunkH*0.06);
      ctx.bezierCurveTo(cx+swayX*0.3, cliffY-trunkH*0.45, cx+swayX*0.7, cliffY-trunkH*0.72, cx+swayX+tw*0.08, trunkTop+4);
      ctx.stroke();
    }
    ctx.restore();
  }

  if (branchP < 0.01) return;

  // ── BRANCHES with wind sway ──
  const bLen = W*0.35*branchP;
  const bW = Math.max(2, tw*0.45);
  const branchTip = cx + swayX;

  function drawBranch(x,y,angle,len,w,depth) {
    if(depth===0||len<2.5) return;
    // wind sway increases with depth (tips sway more)
    const windBend = wind * (5-depth) * 0.08 * Math.sin(t*1.8 + depth*0.5);
    const wobble = burned ? 0 : windBend;
    const ex = x + Math.cos(angle+wobble)*len;
    const ey = y + Math.sin(angle+wobble)*len;
    const cpx = x + Math.cos(angle-0.15)*len*0.45;
    const cpy = y + Math.sin(angle-0.15)*len*0.45;
    ctx.beginPath(); ctx.moveTo(x,y); ctx.quadraticCurveTo(cpx,cpy,ex,ey);
    ctx.strokeStyle = burned
      ? `rgba(15,6,2,${0.45+depth*0.07})`
      : `rgba(${48+depth*10},${22+depth*4},${6+depth*2},${0.5+depth*0.07})`;
    ctx.lineWidth=Math.max(0.6,w); ctx.lineCap='round'; ctx.stroke();
    if(depth>1){
      const s=0.28+depth*0.045;
      drawBranch(ex,ey,angle-s-Math.random()*0.06,len*0.67,w*0.6,depth-1);
      drawBranch(ex,ey,angle+s*0.86+Math.random()*0.06,len*0.7,w*0.58,depth-1);
      if(depth>2&&Math.random()>0.4) drawBranch(ex,ey,angle-0.04+Math.random()*0.18,len*0.52,w*0.46,depth-2);
    }
  }

  const bDefs=[
    {a:-Math.PI/2-0.48,sf:0.06,lm:1.15},
    {a:-Math.PI/2+0.40,sf:0.13,lm:1.08},
    {a:-Math.PI/2-0.75,sf:0.26,lm:0.95},
    {a:-Math.PI/2+0.68,sf:0.33,lm:0.90},
    {a:-Math.PI/2-0.14,sf:0.01,lm:1.0},
    {a:-Math.PI/2+0.16,sf:0.40,lm:0.86},
  ];
  bDefs.forEach(b=>{
    const by=trunkTop+trunkH*b.sf+swayX*b.sf;
    drawBranch(branchTip,by,b.a,bLen*b.lm*(1-b.sf*0.25),bW*(1-b.sf*0.22),5);
  });

  if(blossomP<0.01) return;

  // collect tips for blossoms
  const tips=[];
  function collectTips(x,y,a,l,d){
    const windBend = wind*(5-d)*0.08*Math.sin(t*1.8+d*0.5);
    const wb = burned?0:windBend;
    const ex=x+Math.cos(a+wb)*l, ey=y+Math.sin(a+wb)*l;
    if(d<=1){tips.push({x:ex,y:ey,r:l*0.92});return;}
    const s=0.28+d*0.045;
    collectTips(ex,ey,a-s,l*0.67,d-1); collectTips(ex,ey,a+s*0.86,l*0.7,d-1);
    if(d>2) collectTips(ex,ey,a-0.04,l*0.52,d-2);
  }
  bDefs.forEach(b=>{const by=trunkTop+trunkH*b.sf+swayX*b.sf; collectTips(branchTip,by,b.a,bLen*b.lm*(1-b.sf*0.25),5);});

  if (burned) {
    // embers
    tips.forEach(t2=>{
      if(Math.random()>0.4)return;
      const g=ctx.createRadialGradient(t2.x,t2.y,0,t2.x,t2.y,t2.r*blossomP*1.3);
      g.addColorStop(0,'rgba(255,85,0,0.72)'); g.addColorStop(1,'transparent');
      ctx.fillStyle=g; ctx.beginPath(); ctx.arc(t2.x,t2.y,t2.r*blossomP*1.3,0,Math.PI*2); ctx.fill();
    });
    return;
  }

  // ── BLOSSOMS ──
  // outer ambient glow
  tips.forEach(t2=>{
    const r=t2.r*blossomP; if(r<1.2)return;
    const g=ctx.createRadialGradient(t2.x,t2.y,0,t2.x,t2.y,r*3.2);
    g.addColorStop(0,'rgba(255,158,196,0.2)'); g.addColorStop(0.5,'rgba(255,100,160,0.08)'); g.addColorStop(1,'transparent');
    ctx.fillStyle=g; ctx.beginPath(); ctx.arc(t2.x,t2.y,r*3.2,0,Math.PI*2); ctx.fill();
  });

  // flowers — sway with wind
  tips.forEach(t2=>{
    const r=t2.r*blossomP; if(r<1.2)return;
    const cnt=Math.max(4,Math.floor(r*2.3));
    for(let i=0;i<cnt;i++){
      const ang=Math.random()*Math.PI*2;
      // wind makes petals drift slightly
      const windDrift = wind*Math.random()*r*0.3;
      const dist=Math.random()*r*1.5;
      const fx=t2.x+Math.cos(ang)*dist+windDrift;
      const fy=t2.y+Math.sin(ang)*dist;
      if(fy>H+8||fx<-10||fx>W+10)continue;
      const fr=1.8+Math.random()*5;
      ctx.save(); ctx.translate(fx,fy);
      // petals rotate with wind
      ctx.rotate(Math.random()*Math.PI*2 + wind*0.5*Math.sin(t*2+fx*0.01));
      for(let k=0;k<5;k++){
        const pa=(k/5)*Math.PI*2;
        ctx.beginPath(); ctx.ellipse(Math.cos(pa)*fr*.88,Math.sin(pa)*fr*.88,fr*.72,fr*.44,pa+Math.PI/2,0,Math.PI*2);
        const rnd=Math.random();
        ctx.fillStyle=rnd>.55?`rgba(255,${165+~~(Math.random()*60)},${188+~~(Math.random()*40)},.86)`:rnd>.26?`rgba(255,${135+~~(Math.random()*50)},${168+~~(Math.random()*40)},.88)`:`rgba(255,${205+~~(Math.random()*50)},${218+~~(Math.random()*37)},.92)`;
        ctx.fill();
      }
      ctx.beginPath(); ctx.arc(0,0,fr*.27,0,Math.PI*2); ctx.fillStyle='rgba(255,228,70,.95)'; ctx.fill();
      ctx.restore();
    }
  });

  // canopy sun through blossoms
  if(blossomP>0.3){
    const sg=ctx.createRadialGradient(cx+swayX,trunkTop-H*0.04,0,cx+swayX,trunkTop-H*0.04,W*0.44);
    sg.addColorStop(0,`rgba(255,205,135,${0.22*blossomP})`); sg.addColorStop(0.38,`rgba(255,155,105,${0.09*blossomP})`); sg.addColorStop(1,'transparent');
    ctx.fillStyle=sg; ctx.fillRect(0,0,W,H);
  }

  // drifting petals near tree
  if(blossomP>0.25){
    for(let i=0;i<14;i++){
      const px=cx+swayX+(Math.random()-.5)*W*1.1;
      const py=trunkTop+Math.random()*trunkH*1.4;
      if(py>H||px<-10||px>W+10)continue;
      ctx.save(); ctx.translate(px,py);
      ctx.rotate(Math.random()*Math.PI*2+wind*Math.random());
      ctx.beginPath(); ctx.ellipse(0,0,4.5,2.8,0,0,Math.PI*2);
      ctx.fillStyle=`rgba(255,${152+~~(Math.random()*80)},${182+~~(Math.random()*40)},${.3+Math.random()*.45})`; ctx.fill();
      ctx.restore();
    }
  }
}

function drawFireflies(ctx, W, H, p, t) {
  const fa = Math.min((p-0.5)/0.3,1)*0.8;
  for(let i=0;i<8;i++){
    const fx = W*(0.2+Math.sin(t*0.7+i*1.3)*0.35);
    const fy = H*(0.35+Math.cos(t*0.5+i*0.9)*0.2);
    const pulse = 0.5+0.5*Math.sin(t*3+i*2.1);
    const g = ctx.createRadialGradient(fx,fy,0,fx,fy,6);
    g.addColorStop(0,`rgba(220,255,180,${fa*pulse*0.9})`);
    g.addColorStop(1,'transparent');
    ctx.fillStyle=g; ctx.beginPath(); ctx.arc(fx,fy,6,0,Math.PI*2); ctx.fill();
  }
}

function lerpC(a,b,t){
  const ah=a.replace('#',''), bh=b.replace('#','');
  const r=(h,i)=>parseInt(h.slice(i,i+2),16);
  const lr=(a,b,t)=>Math.round(a+(b-a)*Math.max(0,Math.min(1,t)));
  const rr=lr(r(ah,0),r(bh,0),t), rg=lr(r(ah,2),r(bh,2),t), rb=lr(r(ah,4),r(bh,4),t);
  return `#${rr.toString(16).padStart(2,'0')}${rg.toString(16).padStart(2,'0')}${rb.toString(16).padStart(2,'0')}`;
}

// ── FIRE (realistic canvas) ──
class FireParticle {
  constructor(W,H){this.W=W;this.H=H;this.reset();}
  reset(){
    const cx=this.W*0.5, spread=this.W*0.32;
    this.x=cx+(Math.random()-.5)*spread*2;
    this.y=this.H*(0.6+Math.random()*0.25);
    this.vx=(Math.random()-.5)*1.6; this.vy=-(1.8+Math.random()*3.2);
    this.life=0; this.maxLife=55+~~(Math.random()*70);
    this.size=9+Math.random()*20; this.type=Math.random()>.28?'flame':'ember';
  }
  update(){
    this.life++; this.x+=this.vx+Math.sin(this.life*.18)*.7; this.y+=this.vy;
    this.vy*=.988; this.vx*=.98; this.size*=.989;
    if(this.life>=this.maxLife||this.size<.4)this.reset();
  }
  draw(ctx){
    const t2=this.life/this.maxLife;
    const alpha=t2<.15?t2/.15:t2>.72?1-(t2-.72)/.28:1;
    if(this.type==='flame'){
      const g=ctx.createRadialGradient(this.x,this.y,0,this.x,this.y+this.size*.3,this.size*1.1);
      if(t2<.3){g.addColorStop(0,`rgba(255,255,200,${alpha*.95})`);g.addColorStop(.25,`rgba(255,220,50,${alpha*.88})`);g.addColorStop(.55,`rgba(255,100,0,${alpha*.7})`);g.addColorStop(.8,`rgba(200,30,0,${alpha*.4})`);g.addColorStop(1,'rgba(100,0,0,0)');}
      else{g.addColorStop(0,`rgba(255,180,30,${alpha*.9})`);g.addColorStop(.3,`rgba(255,80,0,${alpha*.75})`);g.addColorStop(.65,`rgba(180,20,0,${alpha*.45})`);g.addColorStop(1,'rgba(80,0,0,0)');}
      ctx.save(); ctx.translate(this.x,this.y); ctx.scale(1,1.6+Math.sin(this.life*.12)*.2);
      ctx.beginPath(); ctx.arc(0,0,this.size,0,Math.PI*2); ctx.fillStyle=g; ctx.fill(); ctx.restore();
    } else {
      const r=this.size*.35, g=ctx.createRadialGradient(this.x,this.y,0,this.x,this.y,r*2);
      g.addColorStop(0,`rgba(255,240,180,${alpha})`); g.addColorStop(.4,`rgba(255,150,0,${alpha*.7})`); g.addColorStop(1,'rgba(255,50,0,0)');
      ctx.beginPath(); ctx.arc(this.x,this.y,r*2,0,Math.PI*2); ctx.fillStyle=g; ctx.fill();
    }
  }
}

let fireCanvas2 = null, fCtx = null, fireParticles2=[], fireAnimId=null, fireActive=false;

function animateFire2(){

  fCtx.fillStyle=bg; fCtx.fillRect(0,0,fireCanvas2.width,fireCanvas2.height);

// ── TIMER STATE ──
let focusMins=25,breakMins=5,totalSess=2;
let curSess=1,isWork=true,remaining=0,totalSec=0;
let treeP=0,iv=null,armed=false;

function onSlide(){
  focusMins=+document.getElementById('rF').value;
  breakMins=+document.getElementById('rB').value;
  totalSess=+document.getElementById('rS').value;
  document.getElementById('vF').textContent=focusMins+' мин';
  document.getElementById('vB').textContent=breakMins+' мин';
  document.getElementById('vS').textContent=totalSess;
}

function startFocus(){
  curSess=1;isWork=true;treeP=0;armed=false;
  stopFire2(); sceneTime=0;
  show('sFocus');
  startScene();
  startPetals();
  beginPhase();
}

function beginPhase(){
  clearInterval(iv);
  totalSec=(isWork?focusMins:breakMins)*60;
  remaining=totalSec;
  refreshUI();
  iv=setInterval(tick,1000);
}

const HINTS=['Сосредоточься, Глеб 🌸','Ты в потоке 🌊','Сакура растёт...','Не отвлекайся 💪','Ещё немного!'];

function tick(){
  remaining=Math.max(0,remaining-1);
  if(isWork){
    const done=(curSess-1)*focusMins*60+(focusMins*60-remaining);
    treeP=Math.min(done/(totalSess*focusMins*60),1);
  }
  refreshUI();
  if(remaining<=0){
    clearInterval(iv);
    if(isWork&&curSess>=totalSess)setTimeout(finishWin,500);
    else if(isWork){isWork=false;beginPhase();}
    else{curSess++;isWork=true;beginPhase();}
  }
}

function refreshUI(){
  const m=~~(remaining/60),s=remaining%60;
  const ts=`${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}`;
  document.getElementById('tNum').textContent=ts;
  document.getElementById('tNum').className='t-num '+(isWork?'work':'rest');
  document.getElementById('tPhase').textContent=isWork?'ФОКУС':'ПЕРЕРЫВ';
  document.getElementById('tPhase').className='t-phase '+(isWork?'work':'rest');
  document.getElementById('tHint').textContent=isWork?HINTS[Math.min(~~((1-remaining/totalSec)*HINTS.length),HINTS.length-1)]:'Отдохни, скоро следующая сессия ☕';
  document.getElementById('sessBadge').textContent=`Сессия ${curSess} / ${totalSess}`;
  const btn=document.getElementById('qBtn');
  if(isWork){btn.className='quit-btn work';if(!armed){btn.textContent='🔥 СДАТЬСЯ';btn.style.fontSize='';}btn.disabled=false;}
  else{btn.className='quit-btn rest';btn.textContent=`☕ ПЕРЕРЫВ  ${ts}`;btn.disabled=true;armed=false;}
}

function onQuit(){
  if(!isWork)return;
  if(!armed){
    armed=true;
    const btn=document.getElementById('qBtn');
    btn.textContent='❗ Ещё раз — дерево сгорит';
    btn.style.fontSize='11px';
    setTimeout(()=>{if(armed){armed=false;btn.textContent='🔥 СДАТЬСЯ';btn.style.fontSize='';}},2800);
    return;
  }
  armed=false;
  clearInterval(iv); stopPetals();
  // draw burned scene
  sceneRunning=false; cancelAnimationFrame(animFrame);
  drawScene(sceneCanvas,treeP,true,sceneTime);
  startFire2();
  setTimeout(()=>{
    stopFire2();
    drawEndCanvas('loseCanvas',treeP,true);
    show('sLose');
  },3500);
}

function finishWin(){
  stopPetals(); stopScene();
  const xp=totalSess*focusMins*2;
  document.getElementById('winXp').textContent=`+${xp} XP ⚡`;
  drawEndCanvas('winCanvas',1.0,false);
  try{const c=JSON.parse(localStorage.getItem('xp_total')||'0');localStorage.setItem('xp_total',JSON.stringify(c+xp));}catch(e){}
  show('sWin');
}

function openSettings(){clearInterval(iv);stopPetals();stopScene();stopFire2();armed=false;show('sSettings');drawPreview();}

function show(id){
  document.querySelectorAll('.screen').forEach(s=>s.classList.remove('active'));
  document.getElementById(id).classList.add('active');
}

function goHome(){window.location.href='index.html';}

onSlide();
</script>
</body>
</html>
