<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Фокус</title>
<link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@400;600;700;900&family=Golos+Text:wght@400;500;600&display=swap" rel="stylesheet">
<style>
* { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }

html, body {
  width:100%; height:100%;
  background:#06041a;
  color:#f0e8ff;
  font-family:'Golos Text',sans-serif;
  overflow:hidden;
}

/* ── SCREENS — no fixed, use display none/flex ── */
.screen {
  display:none;
  width:100%;
  height:100vh;
  flex-direction:column;
  overflow:hidden;
}
.screen.active { display:flex; }

/* ════════════════
   SETTINGS SCREEN
════════════════ */
#sSettings {
  background:linear-gradient(180deg,#0d0a28 0%,#130e38 60%,#0d0a28 100%);
  overflow-y:auto;
  align-items:center;
  padding:52px 20px 32px;
  gap:14px;
}
.set-back {
  align-self:flex-start; color:#6050a0; font-size:13px;
  cursor:pointer; text-decoration:underline; text-underline-offset:3px;
  margin-bottom:4px;
}
.set-label {
  font-family:'Unbounded',sans-serif; font-size:11px; font-weight:600;
  letter-spacing:.2em; color:#6050a0; text-transform:uppercase;
}
.set-title {
  font-family:'Unbounded',sans-serif; font-size:22px; font-weight:700;
  text-align:center; margin-bottom:4px;
  background:linear-gradient(135deg,#f0e8ff,#ffb3cc);
  -webkit-background-clip:text; -webkit-text-fill-color:transparent;
}
.sliders { width:100%; display:flex; flex-direction:column; gap:10px; }
.scard {
  background:rgba(255,255,255,0.06); border:1px solid rgba(255,255,255,0.1);
  border-radius:16px; padding:16px 18px;
}
.srow { display:flex; justify-content:space-between; align-items:center; margin-bottom:12px; }
.sname { font-size:14px; font-weight:500; }
.sval { font-family:'Unbounded',sans-serif; font-size:16px; font-weight:700; color:#ff6b9d; }
input[type=range] {
  width:100%; -webkit-appearance:none; height:5px; border-radius:5px;
  background:rgba(255,255,255,0.12); outline:none; cursor:pointer;
}
input[type=range]::-webkit-slider-thumb {
  -webkit-appearance:none; width:24px; height:24px; border-radius:50%;
  background:linear-gradient(135deg,#ff6b9d,#c44dff);
  box-shadow:0 0 12px rgba(255,107,157,.5); cursor:pointer;
}
.start-btn {
  width:100%; background:linear-gradient(135deg,#ff6b9d,#c44dff);
  border:none; border-radius:18px; padding:18px; color:#fff;
  font-family:'Unbounded',sans-serif; font-size:14px; font-weight:700;
  letter-spacing:.08em; cursor:pointer;
  box-shadow:0 8px 30px rgba(255,107,157,.4);
}
.start-btn:active { opacity:.88; transform:scale(.97); }

/* ════════════════
   FOCUS SCREEN
════════════════ */
#sFocus {
  position:relative;
  background:linear-gradient(180deg,
    #1a2a50 0%,
    #243870 18%,
    #2e4a88 32%,
    #3a5898 42%,
    #2a4070 58%,
    #182030 75%,
    #060410 100%);
  justify-content:space-between;
  padding:52px 20px 36px;
}

/* top bar */
.f-top {
  display:flex; justify-content:space-between; align-items:center;
  z-index:10; position:relative;
}
.sess-badge {
  font-family:'Unbounded',sans-serif; font-size:11px; font-weight:600;
  letter-spacing:.1em; color:rgba(240,232,255,.6);
  background:rgba(6,4,26,.6); border:1px solid rgba(255,255,255,.14);
  border-radius:20px; padding:6px 14px;
}
.set-ico {
  width:36px; height:36px; border-radius:12px;
  background:rgba(6,4,26,.6); border:1px solid rgba(255,255,255,.14);
  display:flex; align-items:center; justify-content:center;
  font-size:16px; cursor:pointer;
}

/* tree fills the middle */
.f-tree {
  flex:1;
  display:flex; align-items:flex-end; justify-content:center;
  position:relative; overflow:visible;
  margin:0 -20px; /* bleed to edges */
}
.f-tree svg {
  width:100%; max-height:100%;
  overflow:visible;
}

/* bottom */
.f-bottom {
  display:flex; flex-direction:column; align-items:center; gap:10px;
  z-index:10; position:relative;
}
.quit-btn {
  width:100%; border:none; border-radius:16px; padding:15px;
  font-family:'Unbounded',sans-serif; font-size:13px; font-weight:700;
  letter-spacing:.06em; cursor:pointer; transition:all .35s;
}
.quit-btn.work {
  background:rgba(140,20,20,.4); border:1px solid rgba(255,80,80,.5); color:#ff9090;
}
.quit-btn.rest {
  background:rgba(100,50,200,.4); border:1px solid rgba(160,110,255,.5); color:#c0a8ff;
}
.quit-btn:active { transform:scale(.96); }
.t-phase {
  font-family:'Unbounded',sans-serif; font-size:10px; font-weight:600;
  letter-spacing:.2em; text-transform:uppercase; margin-bottom:1px;
}
.t-phase.work { color:rgba(255,200,215,.65); }
.t-phase.rest { color:rgba(180,215,255,.65); }
.t-num {
  font-family:'Unbounded',sans-serif; font-size:40px; font-weight:900;
  line-height:1; letter-spacing:-.02em; text-align:center;
  text-shadow:0 0 28px rgba(255,150,190,.45), 0 2px 14px rgba(0,0,0,.8);
}
.t-num.work { color:rgba(255,242,248,.88); }
.t-num.rest { color:rgba(200,228,255,.88); }
.t-hint { font-size:11px; color:rgba(200,185,240,.38); margin-top:2px; text-align:center; }

/* ════════════════
   END SCREENS
════════════════ */
.end-screen {
  background:linear-gradient(180deg,#0d0a28,#130e38,#0d0a28);
  align-items:center; justify-content:center; text-align:center;
  padding:60px 24px 40px; gap:0; overflow-y:auto;
}
.end-icon { font-size:58px; margin-bottom:14px; animation:pop .5s cubic-bezier(.34,1.56,.64,1); }
@keyframes pop { from{transform:scale(0)} to{transform:scale(1)} }
.end-title { font-family:'Unbounded',sans-serif; font-size:22px; font-weight:900; margin-bottom:8px; }
.end-title.win { background:linear-gradient(135deg,#ffb3cc,#c44dff); -webkit-background-clip:text; -webkit-text-fill-color:transparent; }
.end-title.lose { color:#ff7070; }
.end-sub { font-size:14px; color:#6050a0; line-height:1.6; margin-bottom:10px; }
.end-xp { font-family:'Unbounded',sans-serif; font-size:30px; font-weight:900; color:#fde047; margin-bottom:16px; }
.end-tree { width:min(280px,85vw); margin:0 auto 22px; display:block; background:#06041a; border-radius:16px; }
.end-btn {
  width:100%; border:none; border-radius:16px; padding:16px;
  color:#fff; font-family:'Unbounded',sans-serif; font-size:13px; font-weight:700; cursor:pointer;
}
.end-btn.win { background:linear-gradient(135deg,#ff6b9d,#c44dff); box-shadow:0 8px 28px rgba(255,107,157,.4); }
.end-btn.lose { background:linear-gradient(135deg,#ff6b6b,#cc2200); }

/* petals */
.petal-wrap { position:absolute; inset:0; overflow:hidden; pointer-events:none; z-index:5; }
.pk {
  position:absolute; top:-18px; opacity:0;
  animation:pfall linear infinite;
}
@keyframes pfall {
  0%   { opacity:0; transform:translateY(0) rotate(0deg) translateX(0); }
  8%   { opacity:.85; }
  90%  { opacity:.6; }
  100% { opacity:0; transform:translateY(105vh) rotate(480deg) translateX(70px); }
}

/* fire */
.fire-wrap { position:absolute; inset:0; pointer-events:none; z-index:20; }
.fp { position:absolute; border-radius:50% 50% 30% 30%; animation:frise linear forwards; }
@keyframes frise { 0%{opacity:1;transform:translateY(0)} 100%{opacity:0;transform:translateY(-190px)} }
</style>
</head>

<!-- SETTINGS -->
<div class="screen active" id="sSettings">
  <div class="set-back" onclick="goHome()">← К задачам</div>

    </div>

    </div>
    <div class="scard">
      <div class="srow"><span class="sname">🔄 Сессий подряд</span><span class="sval" id="vS">2</span></div>
      <input type="range" id="rS" min="1" max="6" value="2" step="1" oninput="onSlide()">
    </div>
  </div>
  <button class="start-btn" onclick="startFocus()">🌱 ПРИСТУПАЮ</button>
</div>

      <!-- BLOSSOMS -->

        <!-- back dark layer for depth -->

        <!-- side clusters back -->
        <ellipse cx="60"  cy="248" rx="80"  ry="58"  fill="rgba(195,95,145,0.48)"/>
        <ellipse cx="340" cy="248" rx="80"  ry="58"  fill="rgba(195,95,145,0.48)"/>

        <!-- main big clusters -->
        <ellipse cx="200" cy="175" rx="135" ry="95"  fill="url(#bG1)"/>
        <ellipse cx="68"  cy="238" rx="88"  ry="62"  fill="url(#bG2)"/>

        <!-- outer overflow -->

        <!-- top crown -->
        <ellipse cx="200" cy="108" rx="88"  ry="60"  fill="rgba(255,215,232,0.92)"/>
        <ellipse cx="148" cy="148" rx="70"  ry="50"  fill="rgba(255,188,215,0.86)"/>
        <ellipse cx="252" cy="148" rx="70"  ry="50"  fill="rgba(255,188,215,0.86)"/>

        <!-- lower sides -->
        <ellipse cx="118" cy="310" rx="62"  ry="44"  fill="rgba(255,158,192,0.72)"/>
        <ellipse cx="282" cy="310" rx="62"  ry="44"  fill="rgba(255,158,192,0.72)"/>

        <!-- bright highlights -->
        <ellipse cx="200" cy="120" rx="72"  ry="48"  fill="rgba(255,238,248,0.5)"/>
        <ellipse cx="162" cy="155" rx="48"  ry="33"  fill="rgba(255,242,250,0.38)"/>
        <ellipse cx="238" cy="150" rx="48"  ry="33"  fill="rgba(255,242,250,0.38)"/>

        <!-- individual flower dots -->
        <g fill="#ffc8e0" opacity="0.95">
          <circle cx="122" cy="215" r="4.5"/><circle cx="108" cy="228" r="3.8"/>
          <circle cx="136" cy="202" r="3.5"/><circle cx="150" cy="188" r="4.2"/>
          <circle cx="165" cy="172" r="3.8"/><circle cx="178" cy="158" r="4.5"/>
          <circle cx="192" cy="142" r="4"/>  <circle cx="208" cy="136" r="4.5"/>
          <circle cx="222" cy="144" r="4"/>  <circle cx="238" cy="158" r="4.2"/>
          <circle cx="252" cy="173" r="3.8"/><circle cx="265" cy="188" r="4.2"/>
          <circle cx="278" cy="205" r="3.5"/><circle cx="292" cy="218" r="4.2"/>
          <circle cx="65"  cy="252" r="4.2"/><circle cx="48"  cy="268" r="3.8"/>
          <circle cx="335" cy="252" r="4.2"/><circle cx="352" cy="268" r="3.8"/>
          <circle cx="200" cy="96"  r="5.5"/><circle cx="184" cy="110" r="4.2"/>
          <circle cx="216" cy="107" r="4.2"/><circle cx="168" cy="128" r="3.8"/>
          <circle cx="232" cy="125" r="3.8"/><circle cx="95"  cy="242" r="3.5"/>
          <circle cx="305" cy="242" r="3.5"/>
        </g>
        <!-- yellow centers -->
        <g fill="#ffd700">
          <circle cx="122" cy="215" r="1.6"/><circle cx="150" cy="188" r="1.6"/>
          <circle cx="178" cy="158" r="1.6"/><circle cx="200" cy="136" r="2"/>
          <circle cx="238" cy="158" r="1.6"/><circle cx="65"  cy="252" r="1.6"/>
          <circle cx="335" cy="252" r="1.6"/><circle cx="200" cy="96"  r="2.2"/>
        </g>

        <!-- ambient glow -->
        <ellipse cx="200" cy="200" rx="155" ry="115" fill="rgba(255,175,210,0.14)"/>
      </g>

      <!-- BURN OVERLAY -->
      <g id="gBurn" opacity="0">
        <ellipse cx="200" cy="200" rx="140" ry="105" fill="rgba(180,50,0,0.55)"/>
        <ellipse cx="200" cy="175" rx="95"  ry="68"  fill="rgba(240,90,0,0.42)"/>
        <ellipse cx="200" cy="155" rx="58"  ry="40"  fill="rgba(255,190,0,0.28)"/>
      </g>

    </svg>
  </div>

  <div class="f-bottom">
    <button class="quit-btn work" id="qBtn" onclick="onQuit()">🔥 СДАТЬСЯ</button>
    <div>
      <div class="t-phase work" id="tPhase">ФОКУС</div>
      <div class="t-num work"   id="tNum">25:00</div>
      <div class="t-hint"       id="tHint">Сосредоточься, Глеб</div>
    </div>
  </div>
</div>

<!-- WIN -->
<div class="screen end-screen" id="sWin">
  <div class="end-icon">🌸</div>
  <div class="end-title win">САКУРА РАСЦВЕЛА</div>
  <div class="end-sub">Ты продержался все сессии.<br>Дерево выросло полностью.</div>
  <div class="end-xp" id="winXp">+50 XP ⚡</div>
  <svg class="end-tree" viewBox="40 80 320 420" height="200">
    <rect x="40" y="80" width="320" height="420" fill="#06041a"/>
    <path d="M190 500 Q188 455 188 415 Q188 372 190 335" stroke="#6a3820" stroke-width="26" fill="none" stroke-linecap="round"/>
    <path d="M185 400 Q155 375 118 352 Q88 332 55 315" stroke="#5c3214" stroke-width="8" fill="none" stroke-linecap="round"/>
    <path d="M195 400 Q225 375 262 352 Q292 332 325 315" stroke="#5c3214" stroke-width="8" fill="none" stroke-linecap="round"/>
    <ellipse cx="200" cy="210" rx="125" ry="88" fill="rgba(200,95,148,0.52)"/>
    <ellipse cx="200" cy="195" rx="118" ry="82" fill="rgba(255,165,200,0.88)"/>
    <ellipse cx="85"  cy="278" rx="72"  ry="52" fill="rgba(255,158,192,0.82)"/>
    <ellipse cx="315" cy="278" rx="72"  ry="52" fill="rgba(255,158,192,0.82)"/>
    <ellipse cx="200" cy="135" rx="80"  ry="55" fill="rgba(255,225,240,0.92)"/>
    <ellipse cx="200" cy="175" rx="62"  ry="42" fill="rgba(255,240,250,0.48)"/>
  </svg>
  <button class="end-btn win" onclick="show('sSettings')">🌱 Новая сессия</button>
</div>

<!-- LOSE -->
<div class="screen end-screen" id="sLose">
  <div class="end-icon">🔥</div>
  <div class="end-title lose">ДЕРЕВО СГОРЕЛО</div>
  <div class="end-sub">Ты прервал фокус.<br>Попробуй снова — у тебя получится.</div>
  <svg class="end-tree" viewBox="40 80 320 420" height="200">
    <rect x="40" y="80" width="320" height="420" fill="#06041a"/>
    <path d="M190 500 Q188 455 188 415 Q188 372 190 335" stroke="#180806" stroke-width="26" fill="none" stroke-linecap="round"/>
    <path d="M185 400 Q155 375 118 352 Q88 332 55 315" stroke="#180806" stroke-width="8" fill="none" stroke-linecap="round"/>
    <path d="M195 400 Q225 375 262 352 Q292 332 325 315" stroke="#180806" stroke-width="8" fill="none" stroke-linecap="round"/>
    <ellipse cx="200" cy="220" rx="110" ry="75" fill="rgba(160,42,0,0.48)"/>
    <ellipse cx="200" cy="195" rx="80"  ry="55" fill="rgba(210,75,0,0.38)"/>
    <ellipse cx="200" cy="172" rx="52"  ry="35" fill="rgba(255,145,0,0.25)"/>
  </svg>
  <button class="end-btn lose" onclick="show('sSettings')">🌱 Попробовать снова</button>
</div>

<script>
// ── TREE ANIMATION ──
function setTreeP(p, burned) {
  const cl = (v,a,b)=>Math.max(a,Math.min(b,v));
  // roots 0–0.15
  document.getElementById('gRoots').style.opacity    = cl((p)/0.15,0,1);
  // trunk 0.05–0.38
  document.getElementById('gTrunk').style.opacity    = cl((p-0.05)/0.33,0,1);
  // branches 0.3–0.65
  document.getElementById('gBranches').style.opacity = cl((p-0.3)/0.35,0,1);
  // blossoms 0.55–1
  const blP = cl((p-0.55)/0.45,0,1);
  document.getElementById('gBlossoms').style.opacity = blP;
  // sun & rays
  document.getElementById('svgSun').setAttribute('opacity', blP*0.9);
  document.getElementById('sunRays').setAttribute('opacity', blP*0.9);
  // burn
  if (burned) {
    document.getElementById('gBurn').style.opacity = '0.85';
    document.getElementById('gBlossoms').style.opacity = Math.max(0, blP-0.4);
  } else {
    document.getElementById('gBurn').style.opacity = '0';
  }
}

// ── PETALS ──
let petalIv=null;
function startPetals(){
  if(petalIv)return;
  const wrap=document.getElementById('petalWrap');
  petalIv=setInterval(()=>{
    const el=document.createElement('div'); el.className='pk';
    el.innerHTML=`<svg width="11" height="8" viewBox="0 0 11 8"><ellipse cx="5.5" cy="4" rx="4.8" ry="3" fill="rgba(255,${146+Math.floor(Math.random()*84)},176,0.84)" transform="rotate(${Math.random()*360} 5.5 4)"/></svg>`;
    el.style.left=Math.random()*100+'%';
    const d=5+Math.random()*7;
    el.style.animationDuration=d+'s';
    el.style.animationDelay=(Math.random()*2)+'s';
    wrap.appendChild(el);
    setTimeout(()=>el.remove(),(d+3)*1000);
  },420);
}
function stopPetals(){
  clearInterval(petalIv); petalIv=null;
  document.getElementById('petalWrap').innerHTML='';
}

// ── FIRE ──
function triggerFire(){
  const wrap=document.getElementById('fireWrap');
  const clrs=['#ff4500','#ff6b00','#ffd700','#ff2200','#ff8c00'];
  for(let i=0;i<70;i++) setTimeout(()=>{
    const el=document.createElement('div'); el.className='fp';
    const sz=12+Math.random()*38;
    el.style.cssText=`width:${sz}px;height:${sz}px;left:${12+Math.random()*76}%;bottom:${20+Math.random()*52}%;background:${clrs[~~(Math.random()*5)]};animation-duration:${0.4+Math.random()*1.4}s;filter:blur(${Math.random()*5}px);opacity:1`;
    wrap.appendChild(el);
    setTimeout(()=>el.remove(),2200);
  },i*28);
}

// ── STATE ──
let focusMins=25,breakMins=5,totalSess=2;
let curSess=1,isWork=true,remaining=0,totalSec=0;
let treeP=0,iv=null,armed=false;

function onSlide(){
  focusMins=+document.getElementById('rF').value;
  breakMins=+document.getElementById('rB').value;
  totalSess=+document.getElementById('rS').value;
  document.getElementById('vF').textContent=focusMins+' мин';
  document.getElementById('vB').textContent=breakMins+' мин';
  document.getElementById('vS').textContent=totalSess;
}

function startFocus(){
  curSess=1;isWork=true;treeP=0;armed=false;
  setTreeP(0,false);
  show('sFocus');
  startPetals();
  beginPhase();
}

function beginPhase(){
  clearInterval(iv);
  totalSec=(isWork?focusMins:breakMins)*60;
  remaining=totalSec;
  refreshUI();
  iv=setInterval(tick,1000);
}

const HINTS=['Сосредоточься, Глеб 🌸','Ты в потоке 🌊','Сакура растёт...','Не отвлекайся 💪','Ещё немного!'];

function tick(){
  remaining=Math.max(0,remaining-1);
  if(isWork){
    const done=(curSess-1)*focusMins*60+(focusMins*60-remaining);
    treeP=Math.min(done/(totalSess*focusMins*60),1);
    setTreeP(treeP,false);
  }
  refreshUI();
  if(remaining<=0){
    clearInterval(iv);
    if(isWork&&curSess>=totalSess) setTimeout(finishWin,500);
    else if(isWork){isWork=false;beginPhase();}
    else{curSess++;isWork=true;beginPhase();}
  }
}

function refreshUI(){
  const m=~~(remaining/60), s=remaining%60;
  const ts=`${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}`;
  document.getElementById('tNum').textContent=ts;
  document.getElementById('tNum').className='t-num '+(isWork?'work':'rest');
  document.getElementById('tPhase').textContent=isWork?'ФОКУС':'ПЕРЕРЫВ';
  document.getElementById('tPhase').className='t-phase '+(isWork?'work':'rest');
  document.getElementById('tHint').textContent=isWork
    ?HINTS[Math.min(~~((1-remaining/totalSec)*HINTS.length),HINTS.length-1)]
    :'Отдохни, скоро следующая сессия ☕';
  document.getElementById('sessBadge').textContent=`Сессия ${curSess} / ${totalSess}`;
  const btn=document.getElementById('qBtn');
  if(isWork){
    btn.className='quit-btn work';
    if(!armed) btn.textContent='🔥 СДАТЬСЯ';
    btn.disabled=false;
  } else {
    btn.className='quit-btn rest';
    btn.textContent=`☕ ПЕРЕРЫВ  ${ts}`;
    btn.disabled=true; armed=false;
  }
}

function onQuit(){
  if(!isWork)return;
  if(!armed){
    armed=true;
    const btn=document.getElementById('qBtn');
    btn.textContent='❗ Ещё раз — дерево сгорит';
    btn.style.fontSize='11px';
    setTimeout(()=>{ if(armed){armed=false;btn.textContent='🔥 СДАТЬСЯ';btn.style.fontSize='';} },2800);
    return;
  }
  armed=false;
  clearInterval(iv); stopPetals();
  setTreeP(treeP,true);
  triggerFire();
  setTimeout(()=>show('sLose'),2100);
}

function finishWin(){
  stopPetals();
  const xp=totalSess*focusMins*2;
  document.getElementById('winXp').textContent=`+${xp} XP ⚡`;
  try{localStorage.setItem('xp_total',JSON.stringify((JSON.parse(localStorage.getItem('xp_total')||'0'))+xp));}catch(e){}
  show('sWin');
}

function openSettings(){clearInterval(iv);stopPetals();armed=false;show('sSettings');}

function show(id){
  document.querySelectorAll('.screen').forEach(s=>s.classList.remove('active'));
  document.getElementById(id).classList.add('active');
}

function goHome(){window.location.href='index.html';}

onSlide();
</script>
</body>
</html>
