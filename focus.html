<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Фокус</title>
<link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@400;600;700;900&family=Golos+Text:wght@400;500;600&display=swap" rel="stylesheet">
<style>
* { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
html, body { width:100%; height:100%; overflow:hidden; background:#0a0e18; }
body { font-family:'Golos Text', sans-serif; color:#f0e8ff; }

.screen { display:none; width:100%; height:100vh; flex-direction:column; overflow:hidden; }
.screen.active { display:flex; }

/* ── SETTINGS ── */
#sSettings {
  background: linear-gradient(180deg, #0d0a28, #130e38 60%, #0d0a28);
  overflow-y: auto;
  align-items: center;
  padding: 52px 20px 32px;
  gap: 14px;
}
.set-back { align-self:flex-start; color:#6050a0; font-size:13px; cursor:pointer; text-decoration:underline; text-underline-offset:3px; }
.set-label { font-family:'Unbounded',sans-serif; font-size:11px; font-weight:600; letter-spacing:.2em; color:#6050a0; text-transform:uppercase; }
.set-title { font-family:'Unbounded',sans-serif; font-size:22px; font-weight:700; text-align:center; background:linear-gradient(135deg,#f0e8ff,#ffb3cc); -webkit-background-clip:text; -webkit-text-fill-color:transparent; }

/* Settings preview */
.preview-wrap {
  width: 100%;
  max-width: 320px;
  aspect-ratio: 9/16;
  border-radius: 16px;
  overflow: hidden;
  position: relative;
  background: #0a0e18;
}
.preview-wrap img {
  position: absolute; inset: 0;
  width: 100%; height: 100%;
  object-fit: cover;
  transition: opacity 0.6s ease;
}

.sliders { width:100%; display:flex; flex-direction:column; gap:10px; }
.scard { background:rgba(255,255,255,0.06); border:1px solid rgba(255,255,255,0.1); border-radius:16px; padding:16px 18px; }
.srow { display:flex; justify-content:space-between; align-items:center; margin-bottom:12px; }
.sname { font-size:14px; font-weight:500; }
.sval { font-family:'Unbounded',sans-serif; font-size:16px; font-weight:700; color:#ff6b9d; }
input[type=range] { width:100%; -webkit-appearance:none; height:5px; border-radius:5px; background:rgba(255,255,255,0.12); outline:none; cursor:pointer; }
input[type=range]::-webkit-slider-thumb { -webkit-appearance:none; width:24px; height:24px; border-radius:50%; background:linear-gradient(135deg,#ff6b9d,#c44dff); box-shadow:0 0 12px rgba(255,107,157,.5); cursor:pointer; }
.start-btn { width:100%; background:linear-gradient(135deg,#ff6b9d,#c44dff); border:none; border-radius:18px; padding:18px; color:#fff; font-family:'Unbounded',sans-serif; font-size:14px; font-weight:700; letter-spacing:.08em; cursor:pointer; box-shadow:0 8px 30px rgba(255,107,157,.4); }
.start-btn:active { opacity:.88; transform:scale(.97); }

/* ── FOCUS ── */
#sFocus { position:relative; background:#0a0e18; }

/* SAKURA FRAMES */
.sakura-scene {
  position: absolute;
  inset: 0;
  z-index: 0;
}
.sakura-scene img {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  object-fit: cover;
  object-position: center bottom;
  opacity: 0;
  transition: opacity 0.8s ease-in-out;
  will-change: opacity;
}
.sakura-scene img.visible { opacity: 1; }

/* burn overlay */
.burn-overlay {
  position: absolute; inset: 0; z-index: 1;
  background: linear-gradient(180deg, rgba(180,40,0,0) 20%, rgba(220,60,0,0.55) 60%, rgba(255,100,0,0.35) 100%);
  opacity: 0;
  transition: opacity 1s ease;
  pointer-events: none;
}
.burn-overlay.active { opacity: 1; }

/* vignette — breathing */
.vignette {
  position: absolute; inset: 0; z-index: 1; pointer-events: none;
  background: radial-gradient(ellipse at center, transparent 45%, rgba(0,0,0,0.45) 100%);
  animation: breathe 6s ease-in-out infinite;
}
@keyframes breathe { 0%,100%{opacity:.7} 50%{opacity:1} }

/* CLOUDS */
.clouds-layer { position:absolute; inset:0; z-index:2; pointer-events:none; overflow:hidden; }
.cloud {
  position:absolute; border-radius:50%;
  background:rgba(255,255,255,0.07); filter:blur(24px);
  animation:cloudDrift linear infinite;
}
@keyframes cloudDrift {
  0%   { transform:translateX(-140px); opacity:0; }
  12%  { opacity:1; }
  88%  { opacity:0.6; }
  100% { transform:translateX(calc(100vw + 140px)); opacity:0; }
}

/* WIND STREAKS */
.wind-layer { position:absolute; inset:0; z-index:2; pointer-events:none; overflow:hidden; }
.wstreak {
  position:absolute; height:1px;
  background:linear-gradient(90deg,transparent,rgba(255,255,255,0.14),transparent);
  border-radius:1px; animation:windMove linear infinite; opacity:0;
}
@keyframes windMove {
  0%   { opacity:0; transform:translateX(-120px); }
  15%  { opacity:1; }
  85%  { opacity:0.5; }
  100% { opacity:0; transform:translateX(calc(100vw + 120px)); }
}

/* PETALS */
.petal-layer { position:absolute; inset:0; overflow:hidden; pointer-events:none; z-index:2; }
.pk { position:absolute; top:-16px; opacity:0; animation:pfall linear infinite; }
@keyframes pfall {
  0%   { opacity:0; transform:translateY(0) rotate(0deg) translateX(0); }
  8%   { opacity:.85; }
  90%  { opacity:.65; }
  100% { opacity:0; transform:translateY(108vh) rotate(480deg) translateX(90px); }
}

/* FIRE */
.fire-canvas {
  position: absolute; inset: 0; z-index: 3;
  pointer-events: none; opacity: 0;
  transition: opacity 0.3s;
}
.fire-canvas.active { opacity: 1; }

/* UI */
.focus-ui {
  position: absolute; inset: 0; z-index: 10;
  display: flex; flex-direction: column;
  justify-content: space-between;
  padding: 52px 20px 36px;
  pointer-events: none;
}
.focus-ui > * { pointer-events: all; }
.f-top { display:flex; justify-content:space-between; align-items:center; }
.sess-badge {
  font-family:'Unbounded',sans-serif; font-size:11px; font-weight:600;
  letter-spacing:.1em; color:rgba(240,232,255,.75);
  background:rgba(8,6,20,.6); border:1px solid rgba(255,255,255,.15);
  border-radius:20px; padding:6px 14px; backdrop-filter:blur(10px);
}
.set-ico {
  width:36px; height:36px; border-radius:12px;
  background:rgba(8,6,20,.6); border:1px solid rgba(255,255,255,.15);
  display:flex; align-items:center; justify-content:center;
  font-size:16px; cursor:pointer; backdrop-filter:blur(10px);
}
.f-mid { flex:1; pointer-events:none; }
.f-bottom { display:flex; flex-direction:column; align-items:center; gap:10px; }

.quit-btn {
  width:100%; border:none; border-radius:16px; padding:15px;
  font-family:'Unbounded',sans-serif; font-size:13px; font-weight:700;
  letter-spacing:.06em; cursor:pointer; transition:all .35s;
  backdrop-filter:blur(14px);
}
.quit-btn.work { background:rgba(120,15,15,.4); border:1px solid rgba(255,80,80,.5); color:#ff9090; }
.quit-btn.rest { background:rgba(90,45,180,.4); border:1px solid rgba(160,110,255,.5); color:#c0a8ff; }
.quit-btn:active { transform:scale(.96); }

.t-wrap { text-align:center; }
.t-phase { font-family:'Unbounded',sans-serif; font-size:10px; font-weight:600; letter-spacing:.2em; text-transform:uppercase; }
.t-phase.work { color:rgba(255,200,215,.7); }
.t-phase.rest { color:rgba(180,215,255,.7); }
.t-num {
  font-family:'Unbounded',sans-serif; font-size:40px; font-weight:900;
  line-height:1; letter-spacing:-.02em;
  text-shadow: 0 0 30px rgba(255,150,190,.5), 0 2px 14px rgba(0,0,0,.9);
}
.t-num.work { color:rgba(255,242,248,.92); }
.t-num.rest { color:rgba(200,228,255,.92); }
.t-hint { font-size:11px; color:rgba(200,185,240,.4); margin-top:2px; }

/* ── END SCREENS ── */
.end-screen {
  background: linear-gradient(180deg,#0d0a28,#130e38,#0d0a28);
  align-items:center; justify-content:center; text-align:center;
  padding:60px 24px 40px; overflow-y:auto; gap:0;
}
.end-icon { font-size:58px; margin-bottom:14px; animation:pop .5s cubic-bezier(.34,1.56,.64,1); }
@keyframes pop { from{transform:scale(0)} to{transform:scale(1)} }
.end-title { font-family:'Unbounded',sans-serif; font-size:22px; font-weight:900; margin-bottom:8px; }
.end-title.win { background:linear-gradient(135deg,#ffb3cc,#c44dff); -webkit-background-clip:text; -webkit-text-fill-color:transparent; }
.end-title.lose { color:#ff7070; }
.end-sub { font-size:14px; color:#6050a0; line-height:1.6; margin-bottom:10px; }
.end-xp { font-family:'Unbounded',sans-serif; font-size:30px; font-weight:900; color:#fde047; margin-bottom:16px; }
.end-img-wrap {
  width: min(220px, 75vw);
  aspect-ratio: 9/16;
  border-radius: 16px;
  overflow: hidden;
  margin: 0 auto 22px;
  position: relative;
}
.end-img-wrap img { width:100%; height:100%; object-fit:cover; }
.end-img-wrap .burn-end {
  position:absolute; inset:0;
  background:linear-gradient(180deg,rgba(160,30,0,0.3) 0%,rgba(220,60,0,0.7) 60%,rgba(255,80,0,0.5) 100%);
}
.end-btn { width:100%; border:none; border-radius:16px; padding:16px; color:#fff; font-family:'Unbounded',sans-serif; font-size:13px; font-weight:700; cursor:pointer; }
.end-btn.win { background:linear-gradient(135deg,#ff6b9d,#c44dff); box-shadow:0 8px 28px rgba(255,107,157,.4); }
.end-btn.lose { background:linear-gradient(135deg,#ff6b6b,#cc2200); }
</style>
</head>
<body>

<!-- SETTINGS -->
<div class="screen active" id="sSettings">
  <div class="set-back" onclick="goHome()">← К задачам</div>
  <div class="set-label">режим фокуса</div>
  <div class="set-title">Посади сакуру 🌸</div>

  <!-- Preview showing final frame -->
  <div class="preview-wrap">
    <img src="frame0.PNG" id="prevImg0" style="opacity:1">
    <img src="frame1.PNG" id="prevImg1" style="opacity:0">
    <img src="frame2.PNG" id="prevImg2" style="opacity:0">
    <img src="frame3.PNG" id="prevImg3" style="opacity:0">
    <img src="frame4.PNG" id="prevImg4" style="opacity:0">
    <img src="frame5.PNG" id="prevImg5" style="opacity:1">
  </div>

  <div class="sliders">
    <div class="scard"><div class="srow"><span class="sname">🌸 Время фокуса</span><span class="sval" id="vF">25 мин</span></div><input type="range" id="rF" min="5" max="120" value="25" step="5" oninput="onSlide()"></div>
    <div class="scard"><div class="srow"><span class="sname">☕ Перерыв</span><span class="sval" id="vB">5 мин</span></div><input type="range" id="rB" min="1" max="30" value="5" step="1" oninput="onSlide()"></div>
    <div class="scard"><div class="srow"><span class="sname">🔄 Сессий подряд</span><span class="sval" id="vS">2</span></div><input type="range" id="rS" min="1" max="6" value="2" step="1" oninput="onSlide()"></div>
  </div>
  <button class="start-btn" onclick="startFocus()">🌱 ПРИСТУПАЮ</button>
</div>

<!-- FOCUS -->
<div class="screen" id="sFocus">
  <!-- SAKURA FRAMES — all 6 stacked, crossfade between them -->
  <div class="sakura-scene" id="sakuraScene">
    <img src="frame0.PNG" id="f0" class="visible" alt="">
    <img src="frame1.PNG" id="f1" alt="">
    <img src="frame2.PNG" id="f2" alt="">
    <img src="frame3.PNG" id="f3" alt="">
    <img src="frame4.PNG" id="f4" alt="">
    <img src="frame5.PNG" id="f5" alt="">
  </div>

  <div class="burn-overlay" id="burnOverlay"></div>
  <div class="vignette"></div>

  <!-- CLOUDS -->
  <div class="clouds-layer" id="cloudsLayer"></div>

  <!-- WIND STREAKS -->
  <div class="wind-layer" id="windLayer"></div>

  <div class="petal-layer" id="petalLayer"></div>
  <canvas class="fire-canvas" id="fireCanvas"></canvas>

  <div class="focus-ui">
    <div class="f-top">
      <div class="sess-badge" id="sessBadge">Сессия 1 / 2</div>
      <div class="set-ico" onclick="openSettings()">⚙️</div>
    </div>
    <div class="f-mid"></div>
    <div class="f-bottom">
      <button class="quit-btn work" id="qBtn" onclick="onQuit()">🔥 СДАТЬСЯ</button>
      <div class="t-wrap">
        <div class="t-phase work" id="tPhase">ФОКУС</div>
        <div class="t-num work" id="tNum">25:00</div>
        <div class="t-hint" id="tHint">Сосредоточься, Глеб</div>
      </div>
    </div>
  </div>
</div>

<!-- WIN -->
<div class="screen end-screen" id="sWin">
  <div class="end-icon">🌸</div>
  <div class="end-title win">САКУРА РАСЦВЕЛА</div>
  <div class="end-sub">Ты продержался все сессии.<br>Дерево выросло полностью.</div>
  <div class="end-xp" id="winXp">+50 XP ⚡</div>
  <div class="end-img-wrap"><img src="frame5.PNG"></div>
  <button class="end-btn win" onclick="show('sSettings')">🌱 Новая сессия</button>
</div>

<!-- LOSE -->
<div class="screen end-screen" id="sLose">
  <div class="end-icon">🔥</div>
  <div class="end-title lose">ДЕРЕВО СГОРЕЛО</div>
  <div class="end-sub">Ты прервал фокус.<br>Попробуй снова — у тебя получится.</div>
  <div class="end-img-wrap" id="loseImgWrap">
    <img id="loseImg" src="frame0.PNG">
    <div class="burn-end"></div>
  </div>
  <button class="end-btn lose" onclick="show('sSettings')">🌱 Попробовать снова</button>
</div>

<script>
// ══════════════════════════════════════
//  PRELOAD ALL FRAMES
// ══════════════════════════════════════
const FRAMES = ['frame0.PNG','frame1.PNG','frame2.PNG','frame3.PNG','frame4.PNG','frame5.PNG'];
const preloaded = {};
let allLoaded = false;

function preloadImages() {
  let count = 0;
  FRAMES.forEach(src => {
    const img = new Image();
    img.onload = () => { count++; if(count === FRAMES.length) allLoaded = true; };
    img.src = src;
    preloaded[src] = img;
  });
}
preloadImages();

// ══════════════════════════════════════
//  CROSSFADE FRAME SYSTEM
// ══════════════════════════════════════
// progress 0→1 maps to frames 0→5
// Between frames we crossfade using opacity

let currentFrameIndex = 0;

function setProgress(p) {
  // map progress to frame position (0 to 5)
  const framePos = p * 5;
  const lowerFrame = Math.floor(framePos);
  const upperFrame = Math.min(lowerFrame + 1, 5);
  const blend = framePos - lowerFrame; // 0 to 1 between frames

  // set opacities: lower frame = 1-blend, upper frame = blend
  // all others = 0
  for (let i = 0; i <= 5; i++) {
    const el = document.getElementById('f' + i);
    if (!el) continue;
    let opacity = 0;
    if (i === lowerFrame) opacity = 1 - blend;
    else if (i === upperFrame) opacity = blend;
    el.style.opacity = opacity;
    el.style.transition = blend > 0 ? 'opacity 0.8s ease-in-out' : 'none';
  }
}

// ══════════════════════════════════════
//  REALISTIC FIRE — Canvas
// ══════════════════════════════════════
const fireCanvas = document.getElementById('fireCanvas');
const fCtx = fireCanvas.getContext('2d');
let fireParticles = [];
let fireAnimId = null;
let fireRunning = false;

function resizeFire() {
  fireCanvas.width = window.innerWidth;
  fireCanvas.height = window.innerHeight;
}
resizeFire();
window.addEventListener('resize', resizeFire);

class FirePart {
  constructor() { this.reset(); }
  reset() {
    const cx = fireCanvas.width * 0.5;
    const spread = fireCanvas.width * 0.38;
    this.x = cx + (Math.random() - 0.5) * spread * 2;
    this.y = fireCanvas.height * (0.55 + Math.random() * 0.3);
    this.vx = (Math.random() - 0.5) * 1.8;
    this.vy = -(1.6 + Math.random() * 3.4);
    this.life = 0;
    this.maxLife = 55 + ~~(Math.random() * 75);
    this.size = 8 + Math.random() * 22;
    this.isEmber = Math.random() > 0.72;
  }
  update() {
    this.life++;
    this.x += this.vx + Math.sin(this.life * 0.18) * 0.7;
    this.y += this.vy;
    this.vy *= 0.987; this.vx *= 0.979; this.size *= 0.989;
    if (this.life >= this.maxLife || this.size < 0.4) this.reset();
  }
  draw(ctx) {
    const t = this.life / this.maxLife;
    const a = t < 0.15 ? t / 0.15 : t > 0.72 ? 1 - (t - 0.72) / 0.28 : 1;
    if (this.isEmber) {
      const r = this.size * 0.3;
      const g = ctx.createRadialGradient(this.x, this.y, 0, this.x, this.y, r * 2.5);
      g.addColorStop(0, `rgba(255,240,180,${a})`);
      g.addColorStop(0.5, `rgba(255,140,0,${a * 0.6})`);
      g.addColorStop(1, 'rgba(255,40,0,0)');
      ctx.beginPath(); ctx.arc(this.x, this.y, r * 2.5, 0, Math.PI * 2);
      ctx.fillStyle = g; ctx.fill();
    } else {
      const g = ctx.createRadialGradient(this.x, this.y, 0, this.x, this.y + this.size * 0.3, this.size * 1.1);
      if (t < 0.3) {
        g.addColorStop(0, `rgba(255,255,200,${a * 0.95})`);
        g.addColorStop(0.3, `rgba(255,220,50,${a * 0.88})`);
        g.addColorStop(0.6, `rgba(255,100,0,${a * 0.7})`);
        g.addColorStop(1, 'rgba(100,0,0,0)');
      } else {
        g.addColorStop(0, `rgba(255,170,30,${a * 0.9})`);
        g.addColorStop(0.35, `rgba(255,75,0,${a * 0.75})`);
        g.addColorStop(0.7, `rgba(170,20,0,${a * 0.45})`);
        g.addColorStop(1, 'rgba(60,0,0,0)');
      }
      ctx.save();
      ctx.translate(this.x, this.y);
      ctx.scale(1, 1.65 + Math.sin(this.life * 0.12) * 0.18);
      ctx.beginPath(); ctx.arc(0, 0, this.size, 0, Math.PI * 2);
      ctx.fillStyle = g; ctx.fill();
      ctx.restore();
    }
  }
}

function initFire() {
  fireParticles = [];
  for (let i = 0; i < 140; i++) {
    const p = new FirePart();
    p.life = ~~(Math.random() * p.maxLife);
    fireParticles.push(p);
  }
}

function animFire() {
  if (!fireRunning) return;
  fCtx.clearRect(0, 0, fireCanvas.width, fireCanvas.height);
  // base heat glow
  const cx = fireCanvas.width * 0.5;
  const by = fireCanvas.height * 0.75;
  const bg = fCtx.createRadialGradient(cx, by, 0, cx, by, fireCanvas.width * 0.45);
  bg.addColorStop(0, 'rgba(255,110,0,0.16)');
  bg.addColorStop(0.5, 'rgba(180,40,0,0.07)');
  bg.addColorStop(1, 'transparent');
  fCtx.fillStyle = bg; fCtx.fillRect(0, 0, fireCanvas.width, fireCanvas.height);
  fireParticles.forEach(p => { p.update(); p.draw(fCtx); });
  fireAnimId = requestAnimationFrame(animFire);
}

function startFire() {
  fireRunning = true;
  resizeFire(); initFire();
  fireCanvas.classList.add('active');
  animFire();
}
function stopFire() {
  fireRunning = false;
  cancelAnimationFrame(fireAnimId);
  fCtx.clearRect(0, 0, fireCanvas.width, fireCanvas.height);
  fireCanvas.classList.remove('active');
}

// ══════════════════════════════════════
//  CLOUDS
// ══════════════════════════════════════
function initClouds() {
  const layer = document.getElementById('cloudsLayer');
  layer.innerHTML = '';
  const clouds = [
    { w:220, h:55, top:'8%',  dur:28, delay:0    },
    { w:160, h:40, top:'14%', dur:22, delay:8    },
    { w:280, h:65, top:'6%',  dur:35, delay:14   },
    { w:130, h:35, top:'20%', dur:18, delay:5    },
    { w:200, h:50, top:'11%', dur:30, delay:20   },
  ];
  clouds.forEach(c => {
    const el = document.createElement('div');
    el.className = 'cloud';
    el.style.cssText = `width:${c.w}px;height:${c.h}px;top:${c.top};left:-${c.w+20}px;animation-duration:${c.dur}s;animation-delay:${c.delay}s`;
    layer.appendChild(el);
  });
}

// ══════════════════════════════════════
//  WIND STREAKS
// ══════════════════════════════════════
function initWind() {
  const layer = document.getElementById('windLayer');
  layer.innerHTML = '';
  for (let i = 0; i < 12; i++) {
    const el = document.createElement('div');
    el.className = 'wstreak';
    const w = 60 + Math.random() * 140;
    const top = 15 + Math.random() * 65;
    const dur = 2.5 + Math.random() * 4;
    const delay = Math.random() * 8;
    el.style.cssText = `width:${w}px;top:${top}%;left:-${w+20}px;animation-duration:${dur}s;animation-delay:${delay}s`;
    layer.appendChild(el);
  }
}

// ══════════════════════════════════════
//  PETALS
// ══════════════════════════════════════
let petalIv = null;
function startPetals() {
  if (petalIv) return;
  const layer = document.getElementById('petalLayer');
  petalIv = setInterval(() => {
    if (treeP < 0.3) return;
    // more petals as tree grows
    const count = treeP > 0.7 ? 3 : treeP > 0.5 ? 2 : 1;
    for (let n = 0; n < count; n++) {
      const el = document.createElement('div'); el.className = 'pk';
      const pink = 146+~~(Math.random()*84);
      el.innerHTML = `<svg width="${8+~~(Math.random()*8)}" height="${6+~~(Math.random()*6)}" viewBox="0 0 11 8"><ellipse cx="5.5" cy="4" rx="4.8" ry="3" fill="rgba(255,${pink},176,${0.7+Math.random()*0.25})" transform="rotate(${Math.random()*360} 5.5 4)"/></svg>`;
      el.style.left = Math.random() * 100 + '%';
      const d = 4 + Math.random() * 8;
      el.style.animationDuration = d + 's';
      el.style.animationDelay = (Math.random() * 1.5) + 's';
      layer.appendChild(el);
      setTimeout(() => el.remove(), (d + 3) * 1000);
    }
  }, 280);
}
function stopPetals() {
  clearInterval(petalIv); petalIv = null;
  document.getElementById('petalLayer').innerHTML = '';
}

// ══════════════════════════════════════
//  TIMER STATE
// ══════════════════════════════════════
let focusMins=25, breakMins=5, totalSess=2;
let curSess=1, isWork=true, remaining=0, totalSec=0;
let treeP=0, iv=null, armed=false;

function onSlide() {
  focusMins = +document.getElementById('rF').value;
  breakMins  = +document.getElementById('rB').value;
  totalSess  = +document.getElementById('rS').value;
  document.getElementById('vF').textContent = focusMins + ' мин';
  document.getElementById('vB').textContent = breakMins + ' мин';
  document.getElementById('vS').textContent = totalSess;
}

function startFocus() {
  curSess=1; isWork=true; treeP=0; armed=false;
  // reset scene
  setProgress(0);
  document.getElementById('burnOverlay').classList.remove('active');
  stopFire();
  show('sFocus');
  initClouds();
  initWind();
  startPetals();
  beginPhase();
}

function beginPhase() {
  clearInterval(iv);
  totalSec = (isWork ? focusMins : breakMins) * 60;
  remaining = totalSec;
  refreshUI();
  iv = setInterval(tick, 1000);
}

const HINTS = ['Сосредоточься, Глеб 🌸','Ты в потоке 🌊','Сакура растёт...','Не отвлекайся 💪','Ещё немного!'];

function tick() {
  remaining = Math.max(0, remaining - 1);
  if (isWork) {
    const done = (curSess-1)*focusMins*60 + (focusMins*60 - remaining);
    treeP = Math.min(done / (totalSess*focusMins*60), 1);
    setProgress(treeP);
  }
  refreshUI();
  if (remaining <= 0) {
    clearInterval(iv);
    if (isWork && curSess >= totalSess) setTimeout(finishWin, 500);
    else if (isWork) { isWork=false; beginPhase(); }
    else { curSess++; isWork=true; beginPhase(); }
  }
}

function refreshUI() {
  const m=~~(remaining/60), s=remaining%60;
  const ts=`${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}`;
  document.getElementById('tNum').textContent = ts;
  document.getElementById('tNum').className = 't-num ' + (isWork?'work':'rest');
  document.getElementById('tPhase').textContent = isWork ? 'ФОКУС' : 'ПЕРЕРЫВ';
  document.getElementById('tPhase').className = 't-phase ' + (isWork?'work':'rest');
  document.getElementById('tHint').textContent = isWork
    ? HINTS[Math.min(~~((1-remaining/totalSec)*HINTS.length),HINTS.length-1)]
    : 'Отдохни, скоро следующая сессия ☕';
  document.getElementById('sessBadge').textContent = `Сессия ${curSess} / ${totalSess}`;
  const btn = document.getElementById('qBtn');
  if (isWork) {
    btn.className = 'quit-btn work';
    if (!armed) { btn.textContent='🔥 СДАТЬСЯ'; btn.style.fontSize=''; }
    btn.disabled = false;
  } else {
    btn.className = 'quit-btn rest';
    btn.textContent = `☕ ПЕРЕРЫВ  ${ts}`;
    btn.disabled = true; armed = false;
  }
}

function onQuit() {
  if (!isWork) return;
  if (!armed) {
    armed = true;
    const btn = document.getElementById('qBtn');
    btn.textContent = '❗ Ещё раз — дерево сгорит';
    btn.style.fontSize = '11px';
    setTimeout(() => { if(armed){armed=false;btn.textContent='🔥 СДАТЬСЯ';btn.style.fontSize='';} }, 2800);
    return;
  }
  armed = false;
  clearInterval(iv); stopPetals();
  // show burn
  document.getElementById('burnOverlay').classList.add('active');
  startFire();
  // set lose screen image to current frame
  const loseFrameIdx = Math.round(treeP * 5);
  document.getElementById('loseImg').src = 'frame' + loseFrameIdx + '.PNG';
  setTimeout(() => { stopFire(); show('sLose'); }, 3500);
}

function finishWin() {
  stopPetals();
  const xp = totalSess * focusMins * 2;
  document.getElementById('winXp').textContent = `+${xp} XP ⚡`;
  try { const c=JSON.parse(localStorage.getItem('xp_total')||'0'); localStorage.setItem('xp_total',JSON.stringify(c+xp)); } catch(e) {}
  show('sWin');
}

function openSettings() { clearInterval(iv); stopPetals(); stopFire(); armed=false; show('sSettings'); }

function show(id) {
  document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
  document.getElementById(id).classList.add('active');
}

function goHome() { window.location.href = 'index.html'; }

onSlide();
</script>
</body>
